<!-- ═══════════════════════════════════════════════════════════════════════
     MOTOR DE PDF VETORIAL (Gen 4) — injetado em 15/08/2026.

     Substitui o par `buildPdfLayout()` + html2canvas. O laudo passa a ser
     DESENHADO no jsPDF: texto selecionável e pesquisável, arquivo pequeno,
     cabeçalho e rodapé em todas as folhas, foto que não é cortada ao meio e
     -198 KB de carregamento (o html2canvas deixa de ser necessário).
     O cabeçalho deste formulário foi PRESERVADO — o que é compartilhado é o
     motor, não a identidade visual.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LAUDO VETORIAL — motor de PDF compartilhado (Gen 4)          15/08/2026

   De onde veio: este arquivo é a GENERALIZAÇÃO do motor que nasceu dentro do
   `form_diagnostico.html` em 13/08. Lá ele era uma classe `Laudo` acoplada a um
   único documento — cabeçalho fixo, margens fixas, uma paleta. Aqui ele vira
   motor: o cabeçalho é injetado por quem usa, as margens e a paleta são
   parâmetros, e as primitivas cobrem o que os OITO formulários precisam.

   Por que existe: os outros forms desenhavam o laudo em HTML e fotografavam com
   html2canvas. Isso significa (a) texto que é imagem — não seleciona, não
   pesquisa, borra a 8 pt; (b) arquivo grande; (c) `page-break-inside:avoid` que
   nunca foi avaliado, porque html2canvas rasteriza, não pagina; (d) PDF BRANCO
   no iPhone quando o canvas passa do orçamento de pixels; (e) -198 KB de
   biblioteca carregada em campo, para nada.

   Regra de ouro do motor: NADA é medido no DOM. Toda altura sai de
   `splitTextToSize` + aritmética, então o mesmo state gera o mesmo PDF em
   qualquer aparelho — que é exatamente o que a paginação por
   `getBoundingClientRect()` nunca conseguiu prometer.
   ═══════════════════════════════════════════════════════════════════════════ */

var LV_PW = 210, LV_PH = 297;

var LV_COR = {
  preto:'#1a1a1a', texto:'#222222', suave:'#666666', linha:'#d9d9d9',
  fundoK:'#f4f4f4', zebra:'#fafafa', laranja:'#f58220', laranja2:'#e85d1f',
  ok:'#177245', at:'#b8860b', cr:'#b3261e', th:'#2b2b2b',
  ambar:'#E07B2E', azul:'#2E4057', escuro:'#3D3D3D', vermelho:'#C0392B'
};

function lvHx(h){
  if (Array.isArray(h)) return h;
  return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
}

/* As fontes padrão do jsPDF são WinAnsi (cp1252). Qualquer caractere fora disso
   sai como lixo no PDF — foi o que aconteceu com "ΔT", que virou "”T" na
   primeira bancada do diagnóstico. lvS() traduz o que dá para traduzir e
   descarta o resto. Acentuação do português, °, ×, µ, ³ e · passam.
   ⚠ ☐ ☑ ✓ ◆ NÃO entram aqui de propósito: quadradinho de marcação é DESENHO
   (lv.check), não caractere — ver §"checkbox vetorial" abaixo. */
var LV_MAPA = {'Δ':'Delta ','δ':'delta ','≤':'<=','≥':'>=','−':'-','–':'-','≈':'~',
  'Ω':'ohm','→':'->','⚠':'!','✓':'v','★':'*','●':'-','↑':'^','↓':'v','⌀':'D','Ø':'D',
  '☐':'','☑':'','☒':'','◆':'','⚡':'*','📷':'','📋':'','📝':'','📏':'','❓':'','✍':'','🏁':''};
function lvS(t){
  t = String(t == null ? '' : t);
  var out = '';
  for (var i = 0; i < t.length; i++){
    var c = t[i], cp = t.codePointAt(i);
    if (cp > 0xFFFF){ i++; continue; }                  // emoji / pares substitutos
    if (LV_MAPA[c] !== undefined){ out += LV_MAPA[c]; continue; }
    if (cp < 32){ out += ' '; continue; }
    if (cp < 256){ out += c; continue; }
    if (c === '‘' || c === '’'){ out += "'"; continue; }
    if (c === '“' || c === '”'){ out += '"'; continue; }
    if (c === '—'){ out += '-'; continue; }
    if (c === '…'){ out += '...'; continue; }
    if (c === '€' || c === '•' || c === '‰'){ out += c; continue; }
    /* fora do WinAnsi e sem tradução: descarta em vez de imprimir lixo */
  }
  return out.replace(/\s+$/,'');
}

/* Desescapa entidades HTML. Os forms guardam texto já escapado em alguns
   caminhos (esc/escHtml); no vetorial isso apareceria literalmente como
   "&amp;" dentro do PDF. */
function lvDesesc(t){
  return String(t == null ? '' : t)
    .replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}

/* ─────────────────────────────────────────────────────────────────────────
   Laudo(doc, meta, opts)

   opts.ml / opts.mr / opts.mbot   margens em mm (padrão 15/15/18)
   opts.cabecalho(L, primeira)     desenha o cabeçalho e DEVOLVE a altura usada
                                   em mm. Recebe `primeira=false` nas folhas 2+,
                                   para o form decidir se repete o cabeçalho
                                   inteiro ou uma faixa de continuação enxuta.
   opts.rodape(L, pagina, total)   opcional; sobrescreve o rodapé padrão
   opts.rodapeEsq                  texto da esquerda do rodapé padrão
   ───────────────────────────────────────────────────────────────────────── */
function Laudo(doc, meta, opts){
  opts = opts || {};
  this.d = doc; this.meta = meta || {}; this.opt = opts;
  this.ML   = opts.ml   != null ? opts.ml   : 15;
  this.MR   = opts.mr   != null ? opts.mr   : 15;
  this.MBOT = opts.mbot != null ? opts.mbot : 18;
  this.C = Object.assign({}, LV_COR, opts.cor || {});
  this.figN = 0;
  this.y = 0;
  this._pend = null;
  this._abrir(true);
}
Laudo.prototype.larg = function(){ return LV_PW - this.ML - this.MR; };
Laudo.prototype.fim  = function(){ return LV_PH - this.MBOT; };
Laudo.prototype._abrir = function(primeira){
  this.y = this.opt.cabecalho ? this.opt.cabecalho(this, !!primeira) : this.ML + 11;
};
Laudo.prototype.novaPagina = function(){ this.d.addPage(); this._abrir(false); };

/* Reserva: se o bloco não cabe INTEIRO, vai para a próxima folha.
   É o `break-inside: avoid` que o html2canvas nunca soube respeitar. */
Laudo.prototype.reserva = function(h){
  if (this.y + h > this.fim()){ this.novaPagina(); return true; }
  return false;
};
Laudo.prototype.espaco = function(h){ this.y += (h == null ? 3 : h); };

/* ── cor / fonte (atalhos internos) ───────────────────────────────────── */
Laudo.prototype._tc = function(c){ var k = lvHx(c); this.d.setTextColor(k[0],k[1],k[2]); return this; };
Laudo.prototype._fc = function(c){ var k = lvHx(c); this.d.setFillColor(k[0],k[1],k[2]); return this; };
Laudo.prototype._dc = function(c){ var k = lvHx(c); this.d.setDrawColor(k[0],k[1],k[2]); return this; };
Laudo.prototype._f  = function(estilo, tam){ this.d.setFont('helvetica', estilo || 'normal'); this.d.setFontSize(tam || 8); return this; };

/* ─────────────────────────────────────────────────────────────────────────
   CHECKBOX VETORIAL — o motivo de ☐/☑ não estarem no mapa de caracteres.

   Nas fontes padrão do jsPDF esses glifos simplesmente não existem: sairiam
   como lixo ou nada. Embutir uma fonte TTF resolveria, mas custa centenas de
   KB por form — contra a rodada de performance de 13/08, que tirou 562 KB do
   caminho de abertura justamente para o técnico não esperar em campo.
   Desenhar é mais barato E mais nítido: um `rect` + duas `line` são vetor puro,
   legíveis em qualquer zoom, e não dependem de fonte nenhuma.
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.check = function(x, y, marcado, tam){
  var d = this.d, s = tam || 2.6;
  this._dc(marcado ? this.C.preto : '#9a9a9a');
  d.setLineWidth(marcado ? 0.32 : 0.2);
  d.rect(x, y, s, s, 'D');
  if (marcado){
    this._dc(this.C.preto); d.setLineWidth(0.42);
    d.line(x + s*0.20, y + s*0.52, x + s*0.42, y + s*0.78);
    d.line(x + s*0.42, y + s*0.78, x + s*0.82, y + s*0.22);
  }
  d.setLineWidth(0.2);
  return x + s;
};

/* Linha de opções: "Estado físico:  [x] Bom   [ ] Regular   [ ] Ruim"
   opcoes = [{v:'boa', lab:'Bom'}, …]   valor = a opção marcada */
Laudo.prototype.opcoes = function(rotulo, opcoes, valor, opt){
  opt = opt || {};
  this._flush(5.6);
  var d = this.d, alt = 5.6;
  this.reserva(alt);
  var x = this.ML;
  if (rotulo){
    this._f('bold', opt.size || 7.5)._tc(this.C.texto);
    d.text(lvS(rotulo), x, this.y + 3.6);
    x += d.getTextWidth(lvS(rotulo)) + 3;
  }
  this._f('normal', opt.size || 7.5);
  for (var i = 0; i < opcoes.length; i++){
    var o = opcoes[i], marc = (o.v === valor);
    this.check(x, this.y + 1.3, marc, 2.6);
    x += 3.6;
    this._tc(marc ? this.C.preto : this.C.texto);
    this._f(marc ? 'bold' : 'normal', opt.size || 7.5);
    d.text(lvS(o.lab), x, this.y + 3.6);
    x += d.getTextWidth(lvS(o.lab)) + 5;
  }
  this.y += alt;
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   BARRA DE SEÇÃO — e o conserto do CABEÇALHO ÓRFÃO.

   ⚠ A barra NÃO é desenhada na hora. Ela fica PENDENTE e só é impressa quando
   o primeiro bloco de conteúdo dela chega — aí as duas coisas são reservadas
   JUNTAS. Sem isso acontece o que a bancada de 13/08 já tinha pego uma vez:
   "REGISTRO FOTOGRÁFICO" sozinho no pé da folha, com 650 px de papel branco
   embaixo e as fotos na folha seguinte. Aqui a correção é do MOTOR, então vale
   para os oito forms de uma vez e não depende de ninguém lembrar.
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.banda = function(txt, opt){
  this._flush(4);                       // se havia outra barra pendente sem conteúdo, imprime
  this._pend = { txt:txt, opt:opt || {}, tipo:'banda' };
  return this;
};
Laudo.prototype._flush = function(hSeguinte){
  if (!this._pend) return;
  var p = this._pend; this._pend = null;
  var opt = p.opt, d = this.d;
  if (p.tipo === 'banda'){
    var alt = opt.alt || 6.6;
    /* exige a barra MAIS o começo do bloco seguinte, limitado ao que cabe numa
       folha inteira (bloco gigante não deve empurrar a barra para sempre) */
    var precisa = alt + 3 + Math.min(hSeguinte || 6, this.fim() - (this.opt.cabecalho ? 30 : 26));
    this.reserva(precisa);
    this._fc(opt.cor || this.C.preto);
    d.rect(this.ML, this.y, this.larg(), alt, 'F');
    this._tc(opt.corTexto || '#ffffff')._f('bold', opt.size || 8.6);
    d.text(lvS(String(p.txt).toUpperCase()), this.ML + 2.5, this.y + alt*0.72);
    this.y += alt + 3;
  } else {                              // subtítulo (h2)
    this.reserva(6 + Math.min(hSeguinte || 6, 60));
    this._tc(opt.cor || this.C.laranja2)._f('bold', opt.size || 8);
    d.text(lvS(p.txt), this.ML, this.y + 3);
    this.y += 6;
  }
};
/* h1 numerado — o formato do laudo de diagnóstico */
Laudo.prototype.h1 = function(n, txt, opt){
  return this.banda((n ? n + '. ' : '') + txt, opt);
};
Laudo.prototype.h2 = function(txt, opt){
  this._flush(4);
  this._pend = { txt:txt, opt:opt || {}, tipo:'h2' };
  return this;
};

/* ── parágrafo ─────────────────────────────────────────────────────────── */
Laudo.prototype.p = function(txt, opt){
  opt = opt || {};
  this._flush((opt.size || 8) >= 9 ? 4.6 : 4.2);
  var d = this.d, larg = (opt.larg || this.larg()) - (opt.recuo || 0);
  var x = this.ML + (opt.recuo || 0);
  var tam = opt.size || 8, passo = opt.passo || (tam >= 9 ? 4.6 : 4.2);
  this._f(opt.bold ? 'bold' : (opt.italico ? 'italic' : 'normal'), tam);
  var linhas = d.splitTextToSize(lvS(lvDesesc(txt)), larg);
  if (!linhas.length) linhas = [''];
  for (var i = 0; i < linhas.length; i++){
    this.reserva(passo + 1);
    this._tc(opt.cor || this.C.texto)._f(opt.bold ? 'bold' : (opt.italico ? 'italic' : 'normal'), tam);
    d.text(lvS(linhas[i]), x, this.y + 3.2);
    this.y += passo;
  }
  this.y += (opt.gap == null ? 2 : opt.gap);
  return this;
};

/* Item numerado — "1. texto…" com o número fora do recuo (form05) */
Laudo.prototype.item = function(n, txt, opt){
  opt = opt || {};
  this._flush(4.2);
  var d = this.d, rec = opt.recuo || 6, tam = opt.size || 8;
  this._f('normal', tam);
  var linhas = d.splitTextToSize(lvS(lvDesesc(txt)), this.larg() - rec);
  for (var i = 0; i < linhas.length; i++){
    this.reserva(5);
    this._tc(opt.cor || this.C.texto)._f('normal', tam);
    if (i === 0) d.text(lvS(String(n) + '.'), this.ML, this.y + 3.2);
    d.text(lvS(linhas[i]), this.ML + rec, this.y + 3.2);
    this.y += 4.2;
  }
  this.y += (opt.gap == null ? 1.6 : opt.gap);
  return this;
};

/* ── caixa de texto livre (o antigo .pdf-obs: pre-wrap + altura mínima) ── */
Laudo.prototype.caixa = function(txt, opt){
  opt = opt || {};
  this._flush(Math.max(opt.altMin || 8, 10));
  var d = this.d, larg = this.larg(), tam = opt.size || 8;
  var texto = lvS(lvDesesc(txt)) || '—';
  this._f('normal', tam);
  /* pre-wrap: as quebras que o técnico digitou são preservadas */
  var brutas = texto.split('\n'), linhas = [];
  for (var i = 0; i < brutas.length; i++){
    var ls = d.splitTextToSize(brutas[i] === '' ? ' ' : brutas[i], larg - 5);
    for (var j = 0; j < ls.length; j++) linhas.push(ls[j]);
  }
  var passo = 4;
  /* Fatiar por FOLHA em vez de reservar o bloco inteiro: uma observação de
     3 000 caracteres não cabe em folha nenhuma, e reservar faria a caixa
     entrar mesmo assim e ser clipada em silêncio — o defeito G5. */
  var k = 0;
  while (k < linhas.length){
    var livre = this.fim() - this.y - 4;
    if (livre < passo*2 + 4){ this.novaPagina(); livre = this.fim() - this.y - 4; }
    var cabem = Math.max(1, Math.floor((livre - 3) / passo));
    var lote = linhas.slice(k, k + cabem);
    var alt = Math.max(opt.altMin || 8, lote.length*passo + 3);
    this._fc(opt.fundo || '#fbfbfb')._dc(this.C.linha);
    d.setLineWidth(0.2);
    d.rect(this.ML, this.y, larg, alt, 'FD');
    if (opt.barra){ this._fc(opt.barra); d.rect(this.ML, this.y, 1.4, alt, 'F'); }
    this._tc(opt.cor || this.C.texto)._f('normal', tam);
    for (var m = 0; m < lote.length; m++) d.text(lvS(lote[m]), this.ML + 2.5, this.y + 4.2 + m*passo);
    this.y += alt;
    k += cabem;
    if (k < linhas.length) this.y += 1;
  }
  this.y += (opt.gap == null ? 3 : opt.gap);
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   MEDIDAS — para agrupar blocos que NÃO PODEM se separar.

   O caso que obrigou a existir: no Termo de Entrega em Locação, o parágrafo do
   termo e as assinaturas são um documento jurídico só. O motor de hoje (`tp-*`)
   garantia isso com um id de grupo; sem equivalente, a bancada de 15/08 pôs o
   termo na folha 2 e a assinatura na 3 — um termo assinado em folha separada
   do que se está aceitando. `medirCaixa` + `medirAssinaturas` + `junto()`
   devolvem esse contrato.
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.medirCaixa = function(txt, opt){
  opt = opt || {};
  var d = this.d, larg = this.larg();
  this._f('normal', opt.size || 8);
  var brutas = (lvS(lvDesesc(txt)) || '—').split('\n'), n = 0;
  for (var i = 0; i < brutas.length; i++) n += d.splitTextToSize(brutas[i] === '' ? ' ' : brutas[i], larg - 5).length;
  return Math.max(opt.altMin || 8, n*4 + 3) + (opt.gap == null ? 3 : opt.gap);
};
Laudo.prototype.medirAssinaturas = function(n, opt){
  opt = opt || {};
  return Math.ceil((n || 0)/2) * (opt.alt || 30);
};
Laudo.prototype.medirParagrafo = function(txt, opt){
  opt = opt || {};
  var tam = opt.size || 8, passo = opt.passo || (tam >= 9 ? 4.6 : 4.2);
  this._f(opt.bold ? 'bold' : 'normal', tam);
  return this.d.splitTextToSize(lvS(lvDesesc(txt)), this.larg()).length * passo + (opt.gap == null ? 2 : opt.gap);
};
/* Reserva um GRUPO inteiro: se o conjunto não cabe no que resta, mas cabe numa
   folha, abre folha nova. Grupo maior que uma folha segue em frente (senão a
   quebra viraria laço infinito). */
Laudo.prototype.junto = function(h){
  var folha = this.fim() - 26;
  if (h <= folha) this.reserva(h);
  return this;
};

/* ── caixa de destaque (sumário executivo) ─────────────────────────────── */
Laudo.prototype.destaque = function(titulo, txt, cor){
  this._flush(16);
  var d = this.d, larg = this.larg();
  this._f('normal', 9);
  var linhas = d.splitTextToSize(lvS(lvDesesc(txt)) || '—', larg - 8);
  var h = 9 + linhas.length*4.6 + 3;
  this.reserva(h + 2);
  var cc = lvHx(cor || this.C.laranja);
  d.setFillColor(250,250,250); d.setDrawColor(cc[0],cc[1],cc[2]); d.setLineWidth(0.4);
  d.rect(this.ML, this.y, larg, h, 'FD');
  d.setFillColor(cc[0],cc[1],cc[2]); d.rect(this.ML, this.y, 1.6, h, 'F');
  d.setTextColor(cc[0],cc[1],cc[2]); this._f('bold', 7);
  d.text(lvS(String(titulo||'').toUpperCase()), this.ML + 5, this.y + 5);
  this._tc(this.C.preto)._f('normal', 9);
  for (var i = 0; i < linhas.length; i++) d.text(lvS(linhas[i]), this.ML + 5, this.y + 10.5 + i*4.6);
  d.setLineWidth(0.2);
  this.y += h + 4;
  return this;
};

/* ── tabela chave/valor ────────────────────────────────────────────────── */
Laudo.prototype.kv = function(pares, opt){
  opt = opt || {};
  this._flush(5.4);
  var d = this.d, larg = this.larg(), kw = opt.kw || 46;
  var pularVazio = opt.pularVazio !== false;
  for (var i = 0; i < pares.length; i++){
    var v = pares[i][1];
    if (pularVazio && (v === undefined || v === null || v === '')) continue;
    if (v === undefined || v === null || v === '') v = '—';
    this._f('normal', opt.size || 7.5);
    var vs = d.splitTextToSize(lvS(lvDesesc(v)), larg - kw - 4);
    var alt = Math.max(5.4, vs.length*4 + 1.6);
    this.reserva(alt);
    this._fc(this.C.fundoK)._dc(this.C.linha);
    d.rect(this.ML, this.y, kw, alt, 'FD');
    d.rect(this.ML + kw, this.y, larg - kw, alt, 'D');
    this._tc(this.C.texto)._f('bold', opt.size || 7.5);
    d.text(lvS(String(pares[i][0])), this.ML + 2, this.y + 3.8);
    this._f('normal', opt.size || 7.5);
    for (var j = 0; j < vs.length; j++) d.text(lvS(vs[j]), this.ML + kw + 2, this.y + 3.8 + j*4);
    this.y += alt;
  }
  this.y += (opt.gap == null ? 3 : opt.gap);
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   TABELA

   cols      : ['Verificação','Valor', …]  (string ou {t, align})
   larguras  : em mm, somando a largura útil
   linhas    : array de arrays de células. Uma célula pode ser:
                 string|number             → texto
                 {cb:true|false}           → checkbox VETORIAL centrado
                 {txt, bold, cor, align}   → texto com estilo
                 {colspan:n, txt:…}        → mescla n colunas a partir dali
   opt.statusCol  : índice cuja cor sai do conteúdo (crítico/atenção/ok)
   opt.boldCol    : índice em negrito
   opt.thCor      : cor do cabeçalho
   opt.semZebra   : desliga a faixa alternada

   O cabeçalho é REEMITIDO em toda folha, marcado "(continuação)" — na coluna
   mais larga, nunca na primeira (numa coluna de 8 mm a marca invadia a vizinha).
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.tabela = function(cols, larguras, linhas, opt){
  opt = opt || {};
  this._flush((opt.altTh || 6) + (opt.altMin || 5.4)*Math.min(2, linhas.length || 1));
  var d = this.d, self = this, cont = false;
  var tamTh = opt.sizeTh || 6.8, tamTd = opt.size || 7.2;
  var colCont = larguras.indexOf(Math.max.apply(null, larguras));
  var altTh = opt.altTh || 6;

  function head(){
    self._fc(opt.thCor || self.C.th);
    d.rect(self.ML, self.y, self.larg(), altTh, 'F');
    self._tc('#ffffff')._f('bold', tamTh);
    var x = self.ML;
    for (var i = 0; i < cols.length; i++){
      var c = cols[i], t = (c && c.t != null) ? c.t : c;
      var marca = (cont && i === colCont) ? ' (continuação)' : '';
      var al = (c && c.align) || 'left';
      var tx = al === 'right' ? x + larguras[i] - 2 : (al === 'center' ? x + larguras[i]/2 : x + 2);
      d.text(lvS(t + marca), tx, self.y + altTh*0.68, al === 'left' ? undefined : {align: al});
      x += larguras[i];
    }
    self.y += altTh;
  }

  this.reserva(altTh + 8); head();

  for (var r = 0; r < linhas.length; r++){
    var cel = linhas[r], partes = [], alturas = [], k;
    this._f('normal', tamTd);
    for (k = 0; k < cel.length; k++){
      var c = cel[k];
      if (c && typeof c === 'object' && c.cb !== undefined){ partes.push(null); alturas.push(1); continue; }
      var txt = (c && typeof c === 'object') ? c.txt : c;
      txt = (txt === null || txt === undefined) ? '' : String(txt);
      var lw = larguras[k] - 4;
      if (c && typeof c === 'object' && c.colspan){
        for (var q = 1; q < c.colspan; q++) lw += larguras[k+q];
      }
      var ls = d.splitTextToSize(lvS(lvDesesc(txt)), Math.max(6, lw));
      partes.push(ls); alturas.push(ls.length || 1);
    }
    var alt = Math.max(opt.altMin || 5.4, Math.max.apply(null, alturas)*3.7 + 2);
    if (this.y + alt > this.fim()){ this.novaPagina(); cont = true; head(); }
    this._dc(this.C.linha); d.setLineWidth(0.2);
    if (!opt.semZebra && r % 2 === 1){ this._fc(this.C.zebra); d.rect(this.ML, this.y, this.larg(), alt, 'F'); }
    var x2 = this.ML, pulos = 0;
    for (k = 0; k < cel.length; k++){
      if (pulos > 0){ pulos--; x2 += larguras[k]; continue; }
      var cc = cel[k], span = (cc && typeof cc === 'object' && cc.colspan) ? cc.colspan : 1;
      var wCel = larguras[k];
      for (var q2 = 1; q2 < span; q2++) wCel += larguras[k+q2];
      pulos = span - 1;
      this._dc(this.C.linha);
      d.rect(x2, this.y, wCel, alt, 'D');

      if (cc && typeof cc === 'object' && cc.cb !== undefined){
        this.check(x2 + wCel/2 - 1.3, this.y + alt/2 - 1.3, !!cc.cb, 2.6);
        x2 += wCel; continue;
      }
      var cor = (cc && typeof cc === 'object' && cc.cor) ? cc.cor : this.C.texto;
      if (opt.statusCol === k){
        var v = String((cc && typeof cc === 'object') ? cc.txt : cc || '');
        if (/cr[íi]tic|reprov|n[ãa]o conforme|^n[ãa]o$/i.test(v)) cor = this.C.cr;
        else if (/aten|parcial|ressalva|regular/i.test(v)) cor = this.C.at;
        else if (/^ok|conforme|^sim$|aprovad|resolvid|^bom$/i.test(v)) cor = this.C.ok;
      }
      var bold = (opt.statusCol === k) || (opt.boldCol === k) || (cc && typeof cc === 'object' && cc.bold);
      var alin = (cc && typeof cc === 'object' && cc.align) || (cols[k] && cols[k].align) || 'left';
      this._tc(cor)._f(bold ? 'bold' : ((cc && cc.italico) ? 'italic' : 'normal'), tamTd);
      var px = alin === 'right' ? x2 + wCel - 2 : (alin === 'center' ? x2 + wCel/2 : x2 + 2);
      for (var j2 = 0; j2 < (partes[k] || []).length; j2++){
        d.text(lvS(partes[k][j2]), px, this.y + 3.4 + j2*3.7, alin === 'left' ? undefined : {align: alin});
      }
      x2 += wCel;
    }
    this.y += alt;
  }
  this.y += (opt.gap == null ? 4 : opt.gap);
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   FIGURAS — foto + legenda como bloco indivisível.

   Este é o conserto que mais vale para o cliente: era aqui que a guilhotina
   cortava meia foto no pé de uma página e meia no topo da outra (o defeito da
   OS PGP-2026-0033). A legenda nunca se separa da figura porque as duas são
   reservadas juntas.
   Sobrando foto ímpar, ela ocupa a linha inteira em vez de deixar meia folha
   branca (G4).
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.figuras = function(fotos, opt){
  opt = opt || {};
  this._flush((fotos && fotos.length) ? ((opt.imgH || 52) + 7) : 5);
  var d = this.d, larg = this.larg(), imgH = opt.imgH || 52, gap = 6;
  var numerar = opt.numerar !== false;
  if (!fotos || !fotos.length){
    return this.p(opt.vazio || 'Sem fotos anexadas.', {size:7.5, cor:this.C.suave});
  }
  for (var i = 0; i < fotos.length; i += 2){
    var par = fotos.slice(i, i + 2);
    /* G4: foto ímpar SOBRANDO de uma grade ocupa a linha toda, em vez de deixar
       meia folha branca. Mas uma seção que tem UMA foto só não é sobra — essa
       fica em meia largura, senão vira um letterbox de 180 mm com a máquina
       minúscula no meio (visto na bancada de 15/08). */
    var sobra = (par.length === 1 && fotos.length > 1 && opt.larguraCheia !== false);
    var colW = sobra ? larg : (larg - gap)/2;
    var altImg = sobra ? imgH * 1.35 : imgH;
    var legAlt = 0, legs = [];
    this._f('normal', 6.6);
    for (var k = 0; k < par.length; k++){
      var base = par[k].legenda || par[k].caption || 'Registro fotográfico';
      var rot = numerar ? ('Figura ' + (this.figN + k + 1) + ' — ' + base) : base;
      var ls = d.splitTextToSize(lvS(lvDesesc(rot)), colW - 2);
      legs.push(ls); legAlt = Math.max(legAlt, ls.length*3.1);
    }
    var alt = altImg + legAlt + 4;
    this.reserva(alt);
    var x = this.ML;
    for (var j = 0; j < par.length; j++){
      this._dc(this.C.linha); d.setLineWidth(0.2);
      d.rect(x, this.y, colW, altImg, 'D');
      var src = par[j].dataUrl || par[j].src || '';
      if (src){
        try{ lvImagemContida(this, src, x + 0.7, this.y + 0.7, colW - 1.4, altImg - 1.4); }
        catch(e){ this._tc(this.C.suave)._f('italic', 6.5);
                  d.text(lvS('imagem não pôde ser embutida'), x + colW/2, this.y + altImg/2, {align:'center'}); }
      } else {
        this._fc('#fafafa'); d.rect(x + 0.5, this.y + 0.5, colW - 1, altImg - 1, 'F');
        this._tc(this.C.suave)._f('italic', 6.5);
        d.text(lvS('foto no Drive — não embutida neste aparelho'), x + colW/2, this.y + altImg/2, {align:'center'});
      }
      this.figN++;
      this._tc(this.C.suave)._f('normal', 6.6);
      for (var l = 0; l < legs[j].length; l++) d.text(lvS(legs[j][l]), x, this.y + altImg + 3.2 + l*3.1);
      x += colW + gap;
    }
    this.y += alt;
  }
  this.y += 2;
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   `object-fit: contain` em jsPDF.

   ⚠ Achado de bancada (15/08): `addImage(src, fmt, x, y, w, h)` ESTICA a
   imagem para preencher a caixa — não existe "contain" nativo. O layout antigo
   dependia de `object-fit:contain` no CSS, então portar direto entregaria TODA
   foto de campo deformada: retrato virando paisagem, máquina achatada. Foi o
   pior defeito visual do porte e não aparece em nenhum teste de contagem.
   Aqui a proporção natural sai de `getImageProperties` e a foto é centralizada
   na caixa, com o vazio pintado de branco — igualzinho ao contain do CSS.
   ───────────────────────────────────────────────────────────────────────── */
function lvImagemContida(L, src, x, y, w, h){
  var d = L.d, fmt = (String(src).indexOf('image/png') > 0) ? 'PNG' : 'JPEG';
  var pw = 0, ph = 0;
  try{ var pr = d.getImageProperties(src); pw = pr.width; ph = pr.height; }catch(e){}
  if (!pw || !ph){ d.addImage(src, fmt, x, y, w, h); return; }
  var k = Math.min(w/pw, h/ph), iw = pw*k, ih = ph*k;
  d.addImage(src, fmt, x + (w - iw)/2, y + (h - ih)/2, iw, ih);
}

/* ── assinaturas ───────────────────────────────────────────────────────── */
Laudo.prototype.assinaturas = function(sigs, opt){
  opt = opt || {};
  this._flush(opt.alt || 30);
  var d = this.d, larg = this.larg(), colW = (larg - 8)/2;
  if (!sigs || !sigs.length) return this;
  for (var i = 0; i < sigs.length; i += 2){
    var par = sigs.slice(i, i + 2), alt = opt.alt || 30;
    this.reserva(alt + 4);
    var x = this.ML;
    for (var j = 0; j < par.length; j++){
      var s = par[j] || {};
      if (s.dataUrl){
        try{ lvImagemContida(this, s.dataUrl, x + 4, this.y + 2, colW - 8, 16); }catch(e){}
      }
      this._dc(this.C.suave); d.setLineWidth(0.2);
      d.line(x, this.y + 20, x + colW, this.y + 20);
      this._tc(this.C.texto)._f('bold', 7.5);
      d.text(lvS(String(s.nome || '')), x, this.y + 24);
      this._tc(this.C.suave)._f('normal', 6.8);
      var papel = String(s.papel || '');
      if (s.ts){ try{ papel += ' — ' + new Date(s.ts).toLocaleString('pt-BR'); }catch(e){} }
      d.text(lvS(papel), x, this.y + 27.5);
      x += colW + 8;
    }
    this.y += alt;
  }
  return this;
};

/* Linha de assinatura em branco no estilo "rótulo ____________" (form05) */
Laudo.prototype.linhaAssinatura = function(rotulo, valor, opt){
  opt = opt || {};
  this._flush(9.5);
  var d = this.d;
  this.reserva(11);
  this._f('normal', opt.size || 8.5)._tc(this.C.texto);
  d.text(lvS(rotulo), this.ML, this.y + 3.5);
  var lx = Math.max(this.ML + 58, this.ML + d.getTextWidth(lvS(rotulo)) + 3);
  this._dc('#787878'); d.setLineWidth(0.25);
  d.line(lx, this.y + 4, LV_PW - this.MR, this.y + 4);
  if (valor){ this._f('bold', opt.size || 8.5); d.text(lvS(String(valor)), lx + 2, this.y + 3); }
  this.y += 9.5;
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   RODAPÉ — só no fim, quando o total de páginas é conhecido.

   Antes (Gen 2) o rodapé existia UMA vez, no fim do bitmap: 4 de 5 páginas
   saíam sem identificação nenhuma. Agora sai em todas, com "Página X de Y".
   ───────────────────────────────────────────────────────────────────────── */
Laudo.prototype.fecharRodapes = function(){
  this._flush(0);
  var d = this.d, total = d.getNumberOfPages(), m = this.meta, o = this.opt;
  for (var p = 1; p <= total; p++){
    d.setPage(p);
    if (o.rodape){ o.rodape(this, p, total); continue; }
    this._dc(this.C.linha); d.setLineWidth(0.2);
    d.line(this.ML, LV_PH - this.MBOT + 6, LV_PW - this.MR, LV_PH - this.MBOT + 6);
    this._tc(this.C.suave)._f('normal', 6.5);
    var esq = o.rodapeEsq || ('propercompressores.com.br · ' + (m.titulo || '') + (m.data ? ' · ' + m.data : ''));
    d.text(lvS(esq), this.ML, LV_PH - this.MBOT + 10);
    if (o.rodapeEsq2 || m.tecnico) d.text(lvS(o.rodapeEsq2 || ('Responsável técnico: ' + (m.tecnico || '—'))), this.ML, LV_PH - this.MBOT + 13);
    d.text(lvS('Página ' + p + ' de ' + total), LV_PW - this.MR, LV_PH - this.MBOT + 10, {align:'right'});
    if (o.rodapeDir2) d.text(lvS(o.rodapeDir2), LV_PW - this.MR, LV_PH - this.MBOT + 13, {align:'right'});
  }
  d.setPage(total);
  return this;
};

/* ─────────────────────────────────────────────────────────────────────────
   CABEÇALHOS PRONTOS

   Decisão de 15/08: cada form MANTÉM o cabeçalho que já tem hoje. O motor é
   que é compartilhado, não a identidade visual. `lvCabDuasFaixas` reproduz o
   cabeçalho de 3 células (logo laranja | título escuro | campos) da corretiva;
   `lvCabBarra` reproduz o cabeçalho de faixa dos form01/03/04; `lvCabMarca`
   reproduz o do diagnóstico e o masthead da genérica/locação.
   Todos aceitam `campos` = [[rótulo, valor], …] e cuidam sozinhos da versão
   ENXUTA das folhas 2+ (faixa de continuação).
   ───────────────────────────────────────────────────────────────────────── */

/* Logo desenhada: círculo laranja com "P" branco — é o `.p1-logo-circle` de
   hoje, agora em vetor. Se o form tiver LOGO_DATAURL, passe `img`. */
function lvLogo(L, x, y, tam, img){
  var d = L.d, s = tam || 11;
  if (img){ try{ d.addImage(img, 'PNG', x, y, s, s); return; }catch(e){} }
  var c = lvHx(L.C.laranja);
  d.setFillColor(c[0],c[1],c[2]);
  d.circle(x + s/2, y + s/2, s/2, 'F');
  d.setTextColor(255,255,255); d.setFont('helvetica','bold'); d.setFontSize(s*0.72);
  d.text('P', x + s/2, y + s/2 + s*0.26, {align:'center'});
}

/* Faixa de continuação padrão (folhas 2+): logo pequena + título + OS · cliente */
function lvFaixaCont(L, titulo, dir, img){
  var d = L.d;
  lvLogo(L, L.ML, 8, 7, img);
  L._tc(L.C.preto)._f('bold', 8);
  d.text(lvS(titulo), L.ML + 9.5, 12.6);
  L._tc(L.C.suave)._f('normal', 7);
  d.text(lvS(d.splitTextToSize(lvS(dir || ''), 92)[0] || ''), LV_PW - L.MR, 12.6, {align:'right'});
  var c = lvHx(L.C.laranja);
  d.setDrawColor(c[0],c[1],c[2]); d.setLineWidth(0.7);
  d.line(L.ML, 15.5, LV_PW - L.MR, 15.5);
  d.setLineWidth(0.2);
  return 20;
}

/* Cabeçalho "marca" — o do laudo de diagnóstico. */
function lvCabMarca(L, primeira, cfg){
  var d = L.d, m = L.meta;
  if (!primeira) return lvFaixaCont(L, cfg.titulo, cfg.dir, cfg.img);
  lvLogo(L, L.ML, 8, 11, cfg.img);
  L._tc(L.C.preto)._f('bold', 10);
  d.text(lvS(cfg.marca || 'PROPER COMPRESSORES'), L.ML + 14, 12.5);
  L._tc(L.C.suave)._f('normal', 7);
  d.text(lvS(cfg.subtitulo || ''), L.ML + 14, 16.5);
  L._tc(L.C.texto)._f('normal', 7.5);
  d.text(lvS(cfg.ref || ''), LV_PW - L.MR, 12.5, {align:'right'});
  L._tc(L.C.suave)._f('normal', 7);
  d.text(lvS(d.splitTextToSize(lvS(cfg.dir || ''), 90)[0] || ''), LV_PW - L.MR, 16.5, {align:'right'});
  var c = lvHx(L.C.laranja);
  d.setDrawColor(c[0],c[1],c[2]); d.setLineWidth(0.9);
  d.line(L.ML, 20.5, LV_PW - L.MR, 20.5);
  d.setLineWidth(0.2);
  return 26;
}

/* Cabeçalho "barra" — logo + título/subtítulo + N linhas de campos à direita.
   É o cabeçalho de hoje do form01, form03 e form04. */
function lvCabBarra(L, primeira, cfg){
  var d = L.d;
  if (!primeira) return lvFaixaCont(L, cfg.titulo, cfg.dir, cfg.img);
  var y0 = 8;
  lvLogo(L, L.ML, y0, 12, cfg.img);
  L._tc(L.C.preto)._f('bold', 10.5);
  d.text(lvS(String(cfg.titulo || '').toUpperCase()), L.ML + 15, y0 + 5);
  L._tc(L.C.suave)._f('normal', 6.8);
  var sub = d.splitTextToSize(lvS(cfg.subtitulo || ''), 88);
  d.text(lvS(sub[0] || ''), L.ML + 15, y0 + 9.4);
  if (sub[1]) d.text(lvS(sub[1]), L.ML + 15, y0 + 12.4);

  /* campos à direita, 2 por linha quando couberem */
  var campos = cfg.campos || [], xr = LV_PW - L.MR, yy = y0 + 2.4;
  var larguraCampos = 78, xIni = xr - larguraCampos;
  for (var i = 0; i < campos.length; i++){
    var lab = campos[i][0], val = campos[i][1];
    if (val === undefined || val === null || val === '') val = '—';
    L._tc(L.C.suave)._f('bold', 6.4);
    d.text(lvS(lab), xIni, yy);
    var lw = d.getTextWidth(lvS(lab)) + 1.5;
    L._tc(L.C.preto)._f('normal', 7);
    var vs = d.splitTextToSize(lvS(lvDesesc(val)), larguraCampos - lw);
    d.text(lvS(vs[0] || ''), xIni + lw, yy);
    yy += 3.6;
  }
  var base = Math.max(y0 + 15, yy) + 1.5;
  var c = lvHx(cfg.corRegua || L.C.laranja);
  d.setDrawColor(c[0],c[1],c[2]); d.setLineWidth(0.9);
  d.line(L.ML, base, LV_PW - L.MR, base);
  d.setLineWidth(0.2);
  return base + 5;
}

/* Cabeçalho "3 células" — a tabela laranja/escura da corretiva. */
function lvCabTresCelulas(L, primeira, cfg){
  var d = L.d;
  if (!primeira) return lvFaixaCont(L, cfg.titulo, cfg.dir, cfg.img);
  var y0 = 10, h = 20, larg = L.larg();
  var wLogo = 16, wTit = larg*0.44, wCampos = larg - wLogo - wTit;
  L._fc(cfg.corLogo || '#F26522'); d.rect(L.ML, y0, wLogo, h, 'F');
  lvLogo(L, L.ML + 2.6, y0 + 4.2, 10.8, cfg.img);
  L._fc(cfg.corTitulo || L.C.escuro); d.rect(L.ML + wLogo, y0, wTit, h, 'F');
  L._tc('#ffffff')._f('bold', 10);
  d.text(lvS(String(cfg.titulo || '').toUpperCase()), L.ML + wLogo + 3, y0 + 7.6);
  L._f('normal', 6.6);
  d.text(lvS(cfg.subtitulo || ''), L.ML + wLogo + 3, y0 + 12);
  L._f('normal', 6);
  d.text(lvS(cfg.marca || 'ProperCare · Proper Compressores'), L.ML + wLogo + 3, y0 + 15.8);

  var xc = L.ML + wLogo + wTit;
  L._dc(L.C.linha); d.setLineWidth(0.2); d.rect(xc, y0, wCampos, h, 'D');
  var campos = cfg.campos || [], yy = y0 + 4.4;
  for (var i = 0; i < campos.length && i < 5; i++){
    var lab = campos[i][0], val = campos[i][1];
    if (val === undefined || val === null || val === '') val = '—';
    L._tc(L.C.suave)._f('bold', 6.2);
    d.text(lvS(lab), xc + 2, yy);
    var lw = d.getTextWidth(lvS(lab)) + 1.4;
    L._tc(L.C.preto)._f('normal', 6.8);
    d.text(lvS(d.splitTextToSize(lvS(lvDesesc(val)), wCampos - lw - 3)[0] || ''), xc + 2 + lw, yy);
    yy += 3.6;
  }
  return y0 + h + 4;
}



</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LAUDOS POR FORM — os 8 documentos desenhados sobre o motor `Laudo`.

   Cada função abaixo é o CORPO do laudo de um formulário: ela lê o `state` que
   o form já mantém (nada de DOM, nada de `#pdf-layout`) e devolve o documento
   jsPDF pronto. É o que substitui o par `buildPdfLayout()` + `html2canvas`.

   Decisão de 15/08: **cada form mantém o cabeçalho que já tem hoje.** O que é
   compartilhado é o motor — paginação, quebra indivisível, rodapé em toda
   folha, tabela com cabeçalho repetido, foto que não é cortada ao meio.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── utilidades comuns aos laudos ──────────────────────────────────────── */
function lvData(d){
  var s = String(d == null ? '' : d).trim();
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : s;
}
function lvNovoDoc(titulo, assunto){
  var ctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  var doc = new ctor({ orientation:'portrait', unit:'mm', format:'a4', compress:true });
  try{ doc.setProperties({ title:titulo, subject:assunto || titulo, creator:'ProperCare' }); }catch(e){}
  return doc;
}

/* ═══════════════════════════════════════════════════════════════════════════
   FORM 03 / FORM 04 — Peritagem mecânica e elétrica

   Os dois são o MESMO documento com catálogos diferentes: `SC` traz título,
   subtítulo, gateway e seções tipadas. Por isso um builder só.
   As três regras do G10 continuam valendo, agora escritas uma vez:
     G10a — item de gateway que não é do tipo escolhido NÃO entra (mesma regra
            da tela: com gateway vazio, nenhum item condicional entra);
     G10b — item não respondido não vira linha de travessão;
     G10c — foto entra como FIGURA, não como a contagem dela.
   ═══════════════════════════════════════════════════════════════════════════ */
function lvResPeritagem(it){
  var v = state.itens[it.k];
  if (v == null || v === '') return { txt:'—', align:'center' };
  if (it.c === 'sn' || it.c === 'snnt'){
    return { txt: ({sim:'Sim', nao:'Não', na:'N/A', nt:'N/T'})[v] || String(v), align:'center' };
  }
  if (it.c === 'escala') return { txt: ({bom:'Bom', regular:'Regular', ruim:'Ruim'})[v] || String(v), align:'center' };
  if (it.c === 'med')    return { txt: String(v) + (it.unit ? (' ' + it.unit) : ''), bold:true, align:'center' };
  /* resposta discursiva: alinhada à esquerda e sem negrito — centralizar um
     parágrafo de duas linhas na coluna estreita era ilegível (bancada 15/08) */
  return { txt: String(v), align:'left' };
}
function lvDocPeritagem(){
  var id = state.identificacao || {};
  var doc = lvNovoDoc(SC.titulo, SC.subtitulo);
  var L = new Laudo(doc, { titulo:SC.titulo, tecnico:id.tecnico || '—', data:lvData(id.data) }, {
    cabecalho: function(L, primeira){
      return lvCabBarra(L, primeira, {
        titulo:SC.titulo,
        subtitulo:SC.subtitulo || '',
        dir:'OS ' + (id.os || '—') + ' · ' + (id.cliente || '—'),
        campos:[
          ['OS Nº', id.os], ['Data:', lvData(id.data)],
          ['Cliente:', id.cliente],
          ['Equip./TAG:', id.equipamento], ['Modelo/Série:', id.modelo],
          ['Horímetro:', id.horimetro], ['Técnico:', id.tecnico]
        ]
      });
    },
    rodapeEsq:'propercompressores.com.br · ' + SC.titulo + ' · documento gerado automaticamente',
    rodapeEsq2:'Responsável técnico: ' + (id.tecnico || '—')
  });

  /* gateway — era a linha "◆ Tipo de unidade: Parafuso". O losango não existe
     na fonte padrão do jsPDF; virou caixa de opções desenhada. */
  L.opcoes(SC.gateway.label + ':', SC.gateway.opts.map(function(o){ return {v:o, lab:o}; }), _gwVal || '');
  L.espaco(2);

  for (var s = 0; s < SC.secoes.length; s++){
    var sec = SC.secoes[s];
    var itens = sec.itens.filter(function(it){
      if (it.gw && it.gw !== _gwVal) return false;                       // G10a
      if (it.c === 'foto') return ((state.fotos[it.k] || []).length > 0);
      var v = state.itens[it.k];
      return !(v == null || v === '');                                   // G10b
    });
    if (!itens.length) continue;

    var linhas = [], fotosSec = [];
    for (var i = 0; i < itens.length; i++){
      var it = itens[i];
      if (it.c === 'foto'){                                              // G10c
        (state.fotos[it.k] || []).forEach(function(f, ix, arr){
          fotosSec.push({
            dataUrl: (f && f.url) ? (_plFotoB64[f.url] || '') : '',
            legenda: it.label.replace(/^Foto\s*[—-]\s*/, '') + (arr.length > 1 ? (' (' + (ix+1) + '/' + arr.length + ')') : '')
          });
        });
        continue;
      }
      var r = lvResPeritagem(it);
      linhas.push([it.label, { txt:r.txt, bold:r.bold, align:r.align }]);
    }
    L.banda(sec.t);
    if (linhas.length) L.tabela([{t:'Item verificado'}, {t:'Resultado', align:'center'}], [138, 42], linhas, { statusCol:1 });
    if (fotosSec.length) L.figuras(fotosSec, { imgH:48 });
  }

  L.banda('D — Observações e recomendações');
  L.caixa(state.observacoes || '—', { altMin:14 });

  L.banda('E — Parecer técnico');
  L.kv([
    ['Parecer',  state.parecer.parecer],
    ['Urgência', state.parecer.urgencia]
  ], { pularVazio:false, kw:40 });
  L.assinaturas([
    { nome:state.parecer.assinatura || id.tecnico || '', papel:'Responsável técnico' },
    { nome:'', papel:'Cliente / ciência' }
  ]);

  PGPX.pdf(L);   // 17/09 — ＋ Adicionar item
  L.fecharRodapes();
  return doc;
}


</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   PGPX — "＋ Adicionar item" · motor de ITENS EXTRAS · 17/09/2026
   ──────────────────────────────────────────────────────────────────────────
   POR QUE EXISTE (regra nova do CLAUDE.md, 17/09). Todo formulário deste
   ecossistema é uma LISTA PLANEJADA, e todo planejamento deixa coisa de fora:
   a peça que só esta máquina tem, o achado que aparece com o cabeçote aberto,
   a medição que o cliente pediu na hora. Sem um lugar para isso, o técnico
   enfia tudo numa observação genérica — e o que vira PDF não vira dado.
   O `＋ Adicionar item` é esse lugar, e a partir de hoje nenhum formulário
   nasce sem ele.

   O QUE ELE É: um módulo AUTOCONTIDO — CSS, DOM, estado, rascunho, foto e
   desenho no PDF, tudo aqui dentro. Ele NÃO lê nem escreve nada do formulário
   hospedeiro; o acoplamento é só o `PGPX.init({...})` e três chamadas:
     • `PGPX.captura()`   → o array que entra no `campos_json`
     • `PGPX.pdf(L, opt)` → desenha a seção no laudo (antes do fecharRodapes)
     • `PGPX.limpar()`    → depois do envio confirmado
   Por isso ele é IDÊNTICO nos 7 formulários: o que muda é só o `init`.

   RASCUNHO PRÓPRIO, de propósito. Os 7 hospedeiros guardam rascunho de 3
   jeitos diferentes (ProperSafe/IndexedDB, localStorage, e dois que não
   guardam nada). Amarrar o PGPX a cada um seria 7 integrações e 7 modos de
   falhar. Ele guarda o seu, em localStorage, por instância
   (`pgpx::<tipo>::<os>::<tarefa>`) — e quem não tinha rascunho nenhum
   (form01, form05) passa a não perder, pelo menos, o que digitou aqui.

   ⚠ ADITIVO: não renomeia nada, não toca no `state` do hospedeiro, não cria
   action nova. O `salvarFotoForm` e o `saveFormulario` são os mesmos de
   sempre — a foto extra viaja com `secao:'extra::<uid>'` e o item extra
   dentro do `campos_json` que já era gravado inteiro.
   ══════════════════════════════════════════════════════════════════════════ */
window.PGPX = (function(){
  'use strict';
  var O = {};              // opções do init
  var ITENS = [];          // o estado, na ordem em que o técnico montou
  var _seq = 0, _montado = false, _chaveRasc = '';

  var TIPOS = [
    { id:'item', ico:'🧾', rot:'Item de lista',  sub:'Ok / NOK / N.A. + observação + foto' },
    { id:'obs',  ico:'📝', rot:'Observação',     sub:'texto livre' },
    { id:'med',  ico:'📏', rot:'Medição',        sub:'grandeza, valor e unidade' },
    { id:'foto', ico:'📷', rot:'Foto',           sub:'com legenda' }
  ];
  var CONDS = ['Ok','NOK','N.A.'];

  function uid(){ _seq++; return 'x' + Date.now().toString(36) + _seq.toString(36); }
  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g, function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
  function attr(s){ return esc(s).replace(/'/g,'&#39;'); }
  function $(sel, raiz){ return (raiz||document).querySelector(sel); }
  function acha(u){ for(var i=0;i<ITENS.length;i++) if(ITENS[i].uid===u) return ITENS[i]; return null; }
  function ctx(){ try{ return (O.contexto && O.contexto()) || {}; }catch(e){ return {}; } }

  /* ── CSS: herda o tema do hospedeiro por var() com queda para o padrão da
        casa (os 7 são escuros, mas o form02 usa outros nomes de variável). ── */
  var CSS = ''
  + '#pgpxCard{background:var(--card,var(--bg-card,#1e293b));border:1px solid var(--border,#334155);'
  +   'border-radius:var(--radius,12px);padding:14px;margin:12px 0}'
  + '#pgpxCard h2{font-size:16px;margin:0 0 4px;color:var(--text,var(--text-primary,#e2e8f0))}'
  + '.pgpx-sub{color:var(--muted,var(--text-secondary,#94a3b8));font-size:12px;margin-bottom:10px;line-height:1.4}'
  + '.pgpx-add{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--brand,#f58220);'
  +   'background:transparent;color:var(--brand,#f58220);font-size:15px;font-weight:700;cursor:pointer;min-height:48px}'
  + '.pgpx-add:active{opacity:.7}'
  + '.pgpx-menu{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}'
  + '.pgpx-menu.open{display:grid}'
  + '.pgpx-opt{background:var(--elev,var(--bg-section,#243349));border:1px solid var(--border,#334155);'
  +   'border-radius:10px;padding:10px;text-align:left;color:inherit;cursor:pointer;min-height:56px}'
  + '.pgpx-opt b{display:block;font-size:13.5px}'
  + '.pgpx-opt span{display:block;font-size:11px;color:var(--muted,var(--text-secondary,#94a3b8));margin-top:2px}'
  + '.pgpx-it{background:var(--elev,var(--bg-section,#243349));border:1px solid var(--border,#334155);'
  +   'border-radius:10px;padding:10px;margin-top:10px;position:relative}'
  + '.pgpx-it .pgpx-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:8px;'
  +   'border:1px solid var(--border,#334155);background:transparent;color:var(--muted,#94a3b8);cursor:pointer}'
  + '.pgpx-it label{display:block;font-size:11px;color:var(--muted,var(--text-secondary,#94a3b8));margin:8px 0 3px}'
  + '.pgpx-it input,.pgpx-it textarea{width:100%;background:var(--bg,var(--bg-app,#0f172a));'
  +   'border:1px solid var(--border,#334155);color:var(--text,var(--text-primary,#f1f5f9));'
  +   'border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit}'
  + '.pgpx-it textarea{min-height:54px;resize:vertical}'
  + '.pgpx-selo{font-size:11px;font-weight:700;color:var(--brand,#f58220);letter-spacing:.4px;text-transform:uppercase}'
  + '.pgpx-pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}'
  + '.pgpx-pill{padding:11px 4px;border-radius:8px;border:1px solid var(--border,#334155);'
  +   'background:transparent;color:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}'
  + '.pgpx-pill.on{background:var(--brand,#f58220);border-color:var(--brand,#f58220);color:#fff}'
  + '.pgpx-pill.on.nok{background:var(--red,#ef4444);border-color:var(--red,#ef4444)}'
  + '.pgpx-row2{display:grid;grid-template-columns:2fr 1fr;gap:8px}'
  + '.pgpx-fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}'
  + '.pgpx-fotos img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:2px solid var(--amber,#f59e0b)}'
  + '.pgpx-fotos img.ok{border-color:var(--green,#22c55e)}'
  + '.pgpx-mini{padding:8px 12px;border-radius:8px;border:1px solid var(--border,#334155);'
  +   'background:transparent;color:inherit;font-size:13px;cursor:pointer;min-height:40px}';

  /* ── DOM ──────────────────────────────────────────────────────────────── */
  function montar(){
    if(_montado) return;
    var host = $(O.host || '#pgpxHost');
    if(!host){ try{ console.warn('[PGPX] host não encontrado:', O.host); }catch(e){} return; }
    var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    host.innerHTML =
      '<div id="pgpxCard">'
      + '<h2>＋ Itens adicionais</h2>'
      + '<div class="pgpx-sub">' + esc(O.sub || 'Para o que este formulário não previu: item, observação, medição ou foto. Entra no PDF e no registro da OS.') + '</div>'
      + '<button type="button" class="pgpx-add" onclick="PGPX.menu()">＋ Adicionar item</button>'
      + '<div class="pgpx-menu" id="pgpxMenu">'
      +   TIPOS.map(function(t){ return '<button type="button" class="pgpx-opt" onclick="PGPX.novo(\'' + t.id + '\')">'
            + '<b>' + t.ico + ' ' + esc(t.rot) + '</b><span>' + esc(t.sub) + '</span></button>'; }).join('')
      + '</div>'
      + '<div id="pgpxLista"></div>'
      + '</div>'
      + '<input type="file" id="pgpxFile" accept="image/*" capture="environment" style="display:none">';
    $('#pgpxFile').addEventListener('change', _arquivoEscolhido);
    _montado = true;
    render();
  }

  function menu(){ var m=$('#pgpxMenu'); if(m) m.classList.toggle('open'); }

  function novo(tipo){
    var it = { uid:uid(), tipo:tipo, titulo:'', cond:'', texto:'', valor:'', unidade:'', fotos:[] };
    ITENS.push(it);
    var m=$('#pgpxMenu'); if(m) m.classList.remove('open');
    render(); salvar();
    var el = $('.pgpx-it[data-uid="'+it.uid+'"]');
    if(el){ el.scrollIntoView({behavior:'smooth', block:'center'});
            var inp = el.querySelector('input'); if(inp) inp.focus(); }
    return it.uid;
  }

  function remover(u){
    if(!confirm('Remover este item?')) return;
    ITENS = ITENS.filter(function(x){ return x.uid!==u; });
    render(); salvar();
  }

  function campo(u, k, v){ var it=acha(u); if(it){ it[k]=v; salvar(); } }
  function cond(u, v){ var it=acha(u); if(!it) return; it.cond=v; render(); salvar(); }

  function htmlItem(it){
    var t = TIPOS.filter(function(x){ return x.id===it.tipo; })[0] || TIPOS[0];
    var h = '<div class="pgpx-it" data-uid="'+it.uid+'">'
      + '<button type="button" class="pgpx-x" onclick="PGPX.remover(\''+it.uid+'\')" aria-label="Remover">✕</button>'
      + '<div class="pgpx-selo">'+t.ico+' '+esc(t.rot)+'</div>';
    if(it.tipo==='med'){
      h += '<label>Grandeza</label><input type="text" value="'+attr(it.titulo)+'" placeholder="Ex.: Folga axial do eixo"'
        +  ' oninput="PGPX.campo(\''+it.uid+'\',\'titulo\',this.value)">'
        +  '<div class="pgpx-row2"><div><label>Valor</label><input type="text" inputmode="decimal" value="'+attr(it.valor)+'"'
        +  ' placeholder="0,0" oninput="PGPX.campo(\''+it.uid+'\',\'valor\',this.value)"></div>'
        +  '<div><label>Unidade</label><input type="text" value="'+attr(it.unidade)+'" placeholder="mm"'
        +  ' oninput="PGPX.campo(\''+it.uid+'\',\'unidade\',this.value)"></div></div>';
    } else {
      h += '<label>'+(it.tipo==='foto'?'Legenda (o que a foto mostra)':'Título do item')+'</label>'
        +  '<input type="text" value="'+attr(it.titulo)+'" placeholder="'
        +  (it.tipo==='foto' ? 'Ex.: Trinca na base do cabeçote' : 'Ex.: Bujão do cárter espanado')+'"'
        +  ' oninput="PGPX.campo(\''+it.uid+'\',\'titulo\',this.value)">';
    }
    if(it.tipo==='item'){
      h += '<label>Condição</label><div class="pgpx-pills">'
        +  CONDS.map(function(c){
             var on = (it.cond===c) ? (' on' + (c==='NOK'?' nok':'')) : '';
             return '<button type="button" class="pgpx-pill'+on+'" onclick="PGPX.cond(\''+it.uid+'\',\''+c+'\')">'+c+'</button>';
           }).join('')
        +  '</div>';
    }
    if(it.tipo==='item' || it.tipo==='obs'){
      h += '<label>'+(it.tipo==='obs'?'Texto':'Observação')+'</label>'
        +  '<textarea placeholder="'+(it.tipo==='obs'?'Descreva…':'O que foi observado / feito…')+'"'
        +  ' oninput="PGPX.campo(\''+it.uid+'\',\'texto\',this.value)">'+esc(it.texto)+'</textarea>';
    }
    if(it.tipo!=='obs' && it.tipo!=='med'){
      h += '<div style="margin-top:8px"><button type="button" class="pgpx-mini" onclick="PGPX.foto(\''+it.uid+'\')">📷 Anexar foto</button></div>'
        +  '<div class="pgpx-fotos">'
        +  (it.fotos||[]).map(function(f){ return '<img src="'+attr(f.dataUrl||'')+'" class="'+(f.status==='ok'?'ok':'')+'" alt="">'; }).join('')
        +  '</div>';
    }
    return h + '</div>';
  }

  function render(){
    var lista = $('#pgpxLista'); if(!lista) return;
    // 🕳 repintar a lista inteira APAGA o cursor de quem está digitando. Só os
    //    itens cujo cartão ainda não existe são desenhados; o resto fica como
    //    está (o valor já vive em ITENS, não no DOM).
    var vistos = {};
    ITENS.forEach(function(it){
      vistos[it.uid] = 1;
      if(!lista.querySelector('.pgpx-it[data-uid="'+it.uid+'"]')){
        var d = document.createElement('div'); d.innerHTML = htmlItem(it);
        lista.appendChild(d.firstChild);
      }
    });
    [].slice.call(lista.querySelectorAll('.pgpx-it')).forEach(function(el){
      if(!vistos[el.dataset.uid]) el.remove();
    });
  }
  function repintar(u){
    var el = $('.pgpx-it[data-uid="'+u+'"]'), it = acha(u);
    if(!el || !it) return;
    var d = document.createElement('div'); d.innerHTML = htmlItem(it);
    el.parentNode.replaceChild(d.firstChild, el);
  }

  /* ── FOTO: comprime aqui dentro (sem depender do compressor do hospedeiro) ── */
  var _fotoAlvo = null;
  function foto(u){ _fotoAlvo = u; var f=$('#pgpxFile'); if(f){ f.value=''; f.click(); } }

  function comprimir(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = function(){ rej(new Error('leitura do arquivo falhou')); };
      fr.onload = function(){
        var img = new Image();
        img.onerror = function(){ rej(new Error('imagem inválida')); };
        img.onload = function(){
          var MAX = 1200, k = Math.min(1, MAX/Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  async function _arquivoEscolhido(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file || !_fotoAlvo) return;
    var u = _fotoAlvo; _fotoAlvo = null;
    var it = acha(u); if(!it) return;
    var dataUrl;
    try{ dataUrl = await comprimir(file); }
    catch(e){ alert('Não consegui ler esta imagem. Tente outra.'); return; }
    var f = { fid:uid(), legenda:(it.titulo || 'Item adicional'), dataUrl:dataUrl, status:'pendente', url:'' };
    it.fotos.push(f);
    repintar(u); salvar();
    try{ await enviarFoto(it, f); f.status='ok'; }
    catch(e){ f.status='pendente'; try{ console.error('[PGPX] foto não subiu:', e); }catch(_c){} }
    repintar(u); salvar();
  }

  function enviarFoto(it, f){
    if(!O.enviarFoto) return Promise.resolve();
    var c = ctx();
    var body = {
      action:'salvarFotoForm',
      os: c.os || '', cliente: c.cliente || 'SemCliente',
      secao: 'extra::' + it.uid,
      legenda: f.legenda,
      nomeArquivo: 'extra_' + f.fid + '.jpg',
      base64: String(f.dataUrl).split(',')[1],
      mimeType: 'image/jpeg',
      categoria: 'foto_' + (O.tipo || 'extra'),
      entity_type: O.tipo || 'extra',
      os_id: c.os_id || '',
      maquina_id: c.maquina_id || '', maquina_label: c.maquina_label || '',
      createdBy: c.createdBy || '',
      foto_uid: f.fid, client_ts: Date.now()
    };
    return Promise.resolve(O.enviarFoto(body, f));
  }

  /* ── RASCUNHO PRÓPRIO (localStorage; a foto vai junto, em base64) ──────── */
  function chave(){
    if(_chaveRasc) return _chaveRasc;
    var c = ctx();
    _chaveRasc = 'pgpx::' + (O.tipo||'form') + '::' + (c.os_id||'avulsa') + '::' + (c.tarefa_id||'');
    return _chaveRasc;
  }
  function salvar(){
    try{ localStorage.setItem(chave(), JSON.stringify(ITENS)); }
    catch(e){ /* cota estourada (foto grande): o item continua na memória */ }
  }
  function restaurar(){
    try{
      var s = localStorage.getItem(chave()); if(!s) return false;
      var a = JSON.parse(s);
      if(!Array.isArray(a) || !a.length) return false;
      ITENS = a.map(function(x){ x.fotos = x.fotos || []; return x; });
      render();
      return true;
    }catch(e){ return false; }
  }
  function limpar(){ ITENS = []; try{ localStorage.removeItem(chave()); }catch(e){} render(); }

  /* ── SAÍDA ────────────────────────────────────────────────────────────── */
  function temConteudo(){
    return ITENS.some(function(it){
      return String(it.titulo||'').trim() || String(it.texto||'').trim()
          || String(it.valor||'').trim() || it.cond || (it.fotos||[]).length; });
  }
  /* O que entra no campos_json. A foto vai como REFERÊNCIA (uid, legenda, url),
     nunca em base64 — o byte já subiu pelo salvarFotoForm. */
  function captura(){
    return ITENS.filter(function(it){
      return String(it.titulo||'').trim() || String(it.texto||'').trim()
          || String(it.valor||'').trim() || it.cond || (it.fotos||[]).length;

     (fetch, XMLHttpRequest e o <script> do JSONP dos formulários) e mostra:
       · barra viva no topo enquanto houver qualquer chamada;
       · aos 3,5 s, um aviso discreto "aguardando o servidor…";
       · aos 9 s, o aviso vira explicação ("o Google Sheets às vezes demora…").

      vistos[chave]=agora;
      try{ console.error('[ERRO_V1]['+tipo+']',msg,detalhe||''); }catch(e){}
      if(agora-ultimo<4000) return;                            // no máx. 1 aviso a cada 4 s
      ultimo=agora;
      var t=String(msg||'erro desconhecido');
      if(/OFFLINE|Failed to fetch|NetworkError|Load failed|Sem conex/i.test(t))
        t='Sem conexão — a alteração NÃO foi gravada.';
      if(typeof window.toast==='function'){ try{ window.toast('⚠ '+t,'error'); return; }catch(e){} }
      proprio('⚠ '+t);
    }catch(e){ /* o tratador de erro nunca pode ser a causa de um erro */ }
  }
  window.addEventListener('error',function(ev){
    if(ev && ev.target && ev.target!==window && ev.target.tagName) return;   // 404 de <img>/<script>
    mostrar('erro',(ev&&ev.message)||'falha no script',
            ev&&ev.filename? (ev.filename+':'+ev.lineno):'');
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev&&ev.reason;
    mostrar('promessa',(r&&r.message)||String(r||'promessa rejeitada'), r&&r.stack);
  });
  window.__perrUltimos=function(){ return vistos; };
}catch(e){}
})();
</script>
