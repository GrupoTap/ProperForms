<style>

<script>
/* ══ 13/08 (perf) — HELPERS DA RODADA DE PERFORMANCE ═══════════════════════
   ADITIVO. Nada aqui substitui o que ja existia: os toast()/showToast(),
   pdfStatus(), psRefreshBadge() e os "btn.disabled=true" continuam valendo.
   Estes helpers cobrem o que NAO tinha sinal nenhum.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Carrega as libs de PDF SOB DEMANDA. Antes desta rodada elas eram dois
   <script> parser-blocking no <head> (~562 KB) em TODA abertura do form, mesmo
   quando o tecnico so ia preencher e sair. Local primeiro (mesmo repo), CDN so
   se o local falhar. A promessa e' memoizada: chamar N vezes baixa 1 vez. */
function pgpEnsureLibsPDF(){
  if (window._pgpLibsPdfPromise) return window._pgpLibsPdfPromise;
  function carregar(local, cdn, jaExiste){
    if (jaExiste()) return Promise.resolve();
    return new Promise(function(ok, falha){
      var s=document.createElement('script'); s.src=local;
      s.onload=function(){ ok(); };
      s.onerror=function(){
        var c=document.createElement('script'); c.src=cdn;
        c.onload=function(){ ok(); };
        c.onerror=function(){ falha(new Error('lib')); };
        document.head.appendChild(c);
      };
      document.head.appendChild(s);
    });
  }
  window._pgpLibsPdfPromise = Promise.all([
    carregar('./jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', function(){ return !!window.jspdf; }),
    carregar('./html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', function(){ return !!window.html2canvas; })
  ]).catch(function(e){ window._pgpLibsPdfPromise=null; throw e; });
  return window._pgpLibsPdfPromise;
}

/* Botao com spinner + trava de duplo-toque. Mesmo nome e semantica do
   PCF L13052 / PCM L11790 — e' o padrao da casa, nao um terceiro dialeto. */
async function _comLoadingBtn_(btnEl, asyncFn, texto){
  if(!btnEl) return asyncFn();
  if(btnEl.dataset.pgpBusy==='1') return;      // trava de duplo-toque
  btnEl.dataset.pgpBusy='1';
  var txt=btnEl.textContent, dis=btnEl.disabled;
  btnEl.disabled=true; btnEl.classList.add('is-busy'); btnEl.textContent=texto||'⏳ Processando…';
  try{ return await asyncFn(); }
  finally{ btnEl.disabled=dis; btnEl.classList.remove('is-busy'); btnEl.textContent=txt; delete btnEl.dataset.pgpBusy; }
}

/* Espera LONGA (gerar PDF, subir ao Drive, baixar fotos): barra fixa no rodape
   que NAO some sozinha e diz o que esta acontecendo. Chamar com null/'' esconde.
   Existe porque o toast da casa dura 2,5 s e o upload dura ate 40 s. */
function pgpEsperaLonga(msg){
  var b=document.getElementById('pgpEsperaBar');
  if(!b){
    if(!msg) return;
    b=document.createElement('div'); b.id='pgpEsperaBar';
    b.setAttribute('role','status'); b.setAttribute('aria-live','polite');
    (document.body||document.documentElement).appendChild(b);
  }
  if(!msg){ b.classList.remove('show'); b.textContent=''; return; }
  b.innerHTML='<span class="pgp-dot"></span>'+String(msg).replace(/[<>&]/g,function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
  b.classList.add('show');
}

/* Aviso discreto de boot ("buscando a maquina da OS"). Some sozinho ao terminar,
   e some TAMBEM quando falha — o catch silencioso do carregarMaquinasOS e'
   intencional: sem rede o tecnico preenche a maquina a mao e segue. */
function pgpBootAviso(msg){
  var e=document.getElementById('pgpBootAviso');
  if(!e){
    if(!msg) return;
    e=document.createElement('div'); e.id='pgpBootAviso';
    e.setAttribute('role','status'); e.setAttribute('aria-live','polite');
    (document.body||document.documentElement).appendChild(e);
  }
  if(!msg){ e.classList.remove('show'); e.textContent=''; return; }
  e.innerHTML='<span class="pgp-dot"></span>'+String(msg).replace(/[<>&]/g,function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
  e.classList.add('show');
}
</script>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_qSb4Ib6VoZs4TE15EYp9qO5sSEhrjadY71yK0Sd4vqnu4msidsObXnQtkCGXpIqq/exec';
const KEY = '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92';
const MAX_IMG_PX = 1200, IMG_QUALITY = 0.82;
function gcBody(obj){ return JSON.stringify(Object.assign({}, obj, { key: KEY, google_credential: window._GC || '' })); }

// 29/07 (F-12): POST robusto ao GAS — parse seguro + retry (bloco canônico do
// form01, 28/07). O Apps Script às vezes responde página HTML de erro; o
// JSON.parse cru estourava "JSON Parse error: Unrecognized token '<'".
async function gasPostJson(payload, tentativas){
  tentativas = tentativas || 3;
  let ultimoErro = null;
  for (let i = 0; i < tentativas; i++){
    try{
      const resp = await fetch(GAS_URL, { method:'POST', body: gcBody(payload) });
      const text = await resp.text();
      try { return JSON.parse(text); }
      catch(ePar){ throw new Error('servidor respondeu página de erro (não-JSON)'); }
    }catch(e){
      ultimoErro = e;
      if (i < tentativas - 1) await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
  }
  throw new Error((ultimoErro && ultimoErro.message) || 'falha de comunicação');
}

function pickPhoto(secao){
  const inp=document.getElementById('fileInput');
  inp.onchange=e=>{ const f=e.target.files[0]; if(f) handlePhoto(secao,f); inp.value=''; };
  inp.click();

function handlePhoto(secao,file){
  // 13/08 (perf): a compressao roda na main thread (FileReader + decode + canvas +
  // toDataURL). Numa foto de 12 MP isso trava a tela por segundos ANTES de a
  // miniatura aparecer — e ate hoje esse intervalo nao tinha sinal nenhum.
  pgpEsperaLonga('📷 Preparando a foto…');
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image(); img.onload=()=>{
    let {width:w,height:h}=img; if(w>MAX_IMG_PX||h>MAX_IMG_PX){const r=Math.min(MAX_IMG_PX/w,MAX_IMG_PX/h);w=Math.round(w*r);h=Math.round(h*r);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    pgpEsperaLonga(null);   // 13/08 (perf): daqui em diante quem sinaliza e' a miniatura
    uploadPhoto(secao,cv.toDataURL('image/jpeg',IMG_QUALITY),file.name||'foto.jpg');
  }; img.onerror=()=>{ pgpEsperaLonga(null); toast('Não consegui ler essa foto'); }; img.src=reader.result; };
  reader.onerror=()=>{ pgpEsperaLonga(null); toast('Não consegui ler essa foto'); };
  reader.readAsDataURL(file);
}
// 29/07 (F-01): legenda humana da foto (rótulo do item do schema) → coluna Caption
function _labelFoto(k){
  for (var i=0;i<SC.secoes.length;i++){
    var its=SC.secoes[i].itens||[];
    for (var j=0;j<its.length;j++){ if (its[j].k===k) return its[j].label||k; }
  }

}
// 13/08 (UX): RETRY CLICAVEL DA FOTO — reposto. form01 e form02 sempre tiveram a
// miniatura vermelha clicavel; form03/form04 nao, e a foto que falhava morria ali
// (o tecnico so via o contorno vermelho e nao tinha o que fazer). Nada do que ja
// ia para o state mudou: o registro 'erro' continua sendo empilhado igual, e o
// retry apenas o ATUALIZA no lugar. foto_uid/client_ts seguem CONGELADOS na
// captura (F-01) — sao passados adiante, nunca regerados.
const _fotoRetryStore = {};
async function uploadPhoto(secao,dataUrl,fileName){
  const cont=document.getElementById('thumbs-'+secao);
  const thumbId='th-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);   // 13/08
  const el=document.createElement('img');el.className='thumb uploading';el.id=thumbId;el.src=dataUrl;cont.appendChild(el);
  state.fotos[secao]=state.fotos[secao]||[];
  // 29/07 (F-01): gerados UMA vez, na captura. O payload abaixo é montado uma
  // única vez e reusado pelas 3 tentativas do gasPostJson → nunca é regerado.
  const _clientTs = Date.now();
  const _fotoUid  = 'f_' + _formUid + '_' + _clientTs + '_' + Math.random().toString(36).slice(2,8);
  await _tentarUploadFoto0304(secao,dataUrl,fileName,thumbId,_clientTs,_fotoUid);
}
async function _tentarUploadFoto0304(secao,dataUrl,fileName,thumbId,_clientTs,_fotoUid){
  const el=document.getElementById(thumbId);
  state.fotos[secao]=state.fotos[secao]||[];
  function _reg(){ return (state.fotos[secao]||[]).filter(function(f){ return f && f.foto_uid===_fotoUid; })[0]; }
  try{
    const payload={action:'salvarFotoForm',os:curOs(),cliente:val('i_cliente')||'SemCliente',secao,nomeArquivo:fileName,base64:dataUrl.split(',')[1],mimeType:'image/jpeg',categoria:'foto_'+SC.tipoForm,entity_type:SC.tipoForm,
      client_ts:_clientTs, foto_uid:_fotoUid, legenda:_labelFoto(secao)};
    const data=await gasPostJson(payload);   // 29/07 (F-12): parse seguro + retry
    if(!data||data.ok!==true) throw new Error(data.error||'falha');
    if(el){ el.className='thumb ok'; el.onclick=null; el.title=''; }
    delete _fotoRetryStore[thumbId];
    var _r=_reg();
    if(_r){ _r.url=data.url; _r.status='ok'; }
    else state.fotos[secao].push({url:data.url,fileName,status:'ok',foto_uid:_fotoUid,client_ts:_clientTs});
    scheduleSave();
  }catch(err){
    if(el){ el.className='thumb erro'; el.title='Falha no envio — toque para reenviar'; el.onclick=function(){ retryFoto(thumbId); }; }
    _fotoRetryStore[thumbId]={ secao:secao, dataUrl:dataUrl, fileName:fileName, clientTs:_clientTs, fotoUid:_fotoUid };
    if(!_reg()) state.fotos[secao].push({url:null,fileName,status:'erro',foto_uid:_fotoUid,client_ts:_clientTs});
    toast('Erro ao enviar foto — toque na miniatura vermelha para reenviar'); scheduleSave();
  }
}
async function retryFoto(thumbId){
  const r=_fotoRetryStore[thumbId]; if(!r) return;
  const el=document.getElementById(thumbId);
  if(el){ el.onclick=null; el.className='thumb uploading'; }
  toast('Reenviando foto…');
  await _tentarUploadFoto0304(r.secao,r.dataUrl,r.fileName,thumbId,r.clientTs,r.fotoUid);
}

// ══ Captura + envio ══
function captura(){
  state.identificacao={ tecnico:val('i_tecnico'),data:val('i_data'),os:val('i_os'),cliente:val('i_cliente'),
    equipamento:val('i_equip'),modelo:val('i_modelo'),horimetro:val('i_horimetro'),ano:val('i_ano') };
  SC.idExtra.forEach(f=>{ state.identificacao[f.k]=val('ix_'+f.k); });
  state.observacoes=val('o_obs');
  state.parecer.assinatura=val('p_assinatura');
}
async function enviar(){
  captura();
  const btn=document.getElementById('btnEnviar');
  // 13/08 (perf): disabled+texto ja existiam; .is-busy soma spinner + trava de
  // duplo-toque, e a barra explica a espera (o POST tem 3 tentativas com backoff).
  if(btn && btn.dataset.pgpBusy==='1') return;
  if(btn) btn.dataset.pgpBusy='1';
  btn.disabled=true; btn.textContent='Enviando…'; if(btn) btn.classList.add('is-busy');
  pgpEsperaLonga('📤 Enviando a peritagem…');
  if(_osId && !_enviado){
    _enviado=true;
    var _sess=null;
    try{ _sess=JSON.parse(localStorage.getItem('proper_session')||'null'); }catch(e){}
    try{
      const fotosFlat=[]; Object.keys(state.fotos).forEach(k=>(state.fotos[k]||[]).forEach(f=>fotosFlat.push(Object.assign({secao:k},f))));
      const payload={action:'saveFormulario',os_id:_osId,tarefa_id:_tarefaId,tipo_formulario:SC.tipoForm,form_uid:_formUid,
        tecnico_nome:state.identificacao.tecnico||(_sess&&_sess.tecnico&&_sess.tecnico.nome)||'',
        tecnico_id:(_sess&&_sess.tecnico&&_sess.tecnico.id)||'',campos_json:state,fotos_json:fotosFlat};
      if(_origem) payload.origem=_origem;                 // 29/07 (F-14)
      const d=await gasPostJson(payload);                 // 29/07 (F-12): parse seguro + retry
      if(d.status!=='ok') throw new Error(d.message||d.error||'Erro do servidor');
      limparRascunho();                                   // 29/07 (F-13): só com OK do servidor
    }catch(e){ _enviado=false; btn.disabled=false; btn.textContent='✓ Concluir peritagem';
      btn.classList.remove('is-busy'); delete btn.dataset.pgpBusy; pgpEsperaLonga(null);   // 13/08 (perf)
      toast('Erro ao enviar: ' + e.message); return; }
  }
  // Gera o PDF da peritagem (estilo Form 02) e sobe ao Drive → Gestão de Documentos
  // na hora, sem depender de finalizar a OS. Não bloqueia a tela de conclusão.
  btn.classList.remove('is-busy'); delete btn.dataset.pgpBusy;   // 13/08 (perf)
  // 13/08 (perf): com PDF, a barra de espera passa a ser do enviarPdfParaDrive
  // (que segue SEM await de proposito — ver a armadilha do _pdfAguardando).
  if(_osId){ _pdfAguardando = enviarPdfParaDrive(); }
  else { pgpEsperaLonga(null); }
  document.getElementById('app').style.display='none';
  const ok=document.getElementById('okScreen'); ok.style.display='';
  document.getElementById('okSub').textContent=_osId?'A tarefa foi concluída no pipeline. Gere o PDF para anexar ao laudo.':'Fotos salvas no Drive — gere o PDF. Sem OS vinculada, os dados do formulário NÃO ficam no sistema.';
  prepararTelaFinal(false);
}

// 12/08 — o "🖨️ Gerar PDF" da tela final imprimia UMA PÁGINA EM BRANCO: `enviar()`
// esconde #app com style inline e a regra @media print só devolve `.card-b`, de
// modo que o que ia para a impressora era o ✅ e duas frases de status — e o
// próprio okSub mandava "Gere o PDF para anexar ao laudo". Agora o #app volta
// durante a impressão e é reescondido depois (o `onafterprint` não é garantido
// em todo navegador, daí o setTimeout de rede).
function imprimirLaudo(){
  var app = document.getElementById('app');
  var ok  = document.getElementById('okScreen');
  if (!app) { window.print(); return; }
  app.style.display = '';
  if (ok) ok.style.display = 'none';
  var restaurar = function(){
    app.style.display = 'none';
    if (ok) ok.style.display = '';
    window.onafterprint = null;
  };
  window.onafterprint = restaurar;
  setTimeout(function(){ window.print(); setTimeout(restaurar, 800); }, 60);
}

// ══ SAÍDA PARA O PIPELINE (12/08/2026) ══════════════════════════════════════
// Chamado do Fernando (12/08): "ao concluir o formulário de recebimento fica
// nessa tela de recebimento registrado e não volta para o pipeline; isso está
// acontecendo em outros forms também". Valia para TODOS os formulários menos o
// form02, que ganhou esta correção sozinho em 29/07 — aqui ela vira padrão.
//
// COMO SE "FECHA" UM FORM: o PCF abre os forms de oficina por
// `window.location.href` (MESMA aba, ver `pfAbrirForm`), então fechar NÃO é
// `window.close()` — é navegar de volta para
// `ProperTech/index.html?modo=pipeline&os_id=<id>`, que o PCF lê no boot e usa
// para reabrir o pipeline direto na OS.
//
// ⚠ O PCM V116 abre o MESMO formulário em ABA NOVA, pela caixa "Tarefas do
//   Adm". Mandar o adm para o app de campo seria pior que não voltar. Por isso
//   o destino vem no parâmetro `?ret=` — declarado por quem abriu, não
//   adivinhado por referrer (que sniffing de referrer erra em PWA e em
//   navegação por link salvo).
// ⚠ `ret` é dado vindo da URL: só é aceito destino sob https://grupotap.github.io/.
//   Sem esse prefixo isto seria um redirecionamento aberto — qualquer link de
//   WhatsApp levaria o técnico logado para fora do sistema.
// ⚠ O auto-retorno só COMEÇA depois que o envio termina (`_pdfAguardando`).
//   Navegar antes mata o upload pela metade — foi exatamente a armadilha
//   documentada no form02 em 29/07.
// ⚠ Uma vez cancelado pelo usuário, o auto-retorno não volta a contar: esta
//   tela é reavaliada a cada atualização da fila de envio, e reiniciar a
//   contagem por baixo do dedo de quem acabou de cancelar é hostil.
var PCF_PIPELINE_URL = 'https://grupotap.github.io/ProperTech/index.html';
var _retornoUrl = '';
var _autoVoltaTimer = null;
var _autoVoltaCancelado = false;
var _pdfAguardando = null;

function lerRetornoDaUrl() {
  var raw = '';
  try { raw = new URLSearchParams(location.search).get('ret') || ''; } catch (e) { raw = ''; }
  _retornoUrl = /^https:\/\/grupotap\.github\.io\//.test(raw) ? raw : '';
}

function destinoDeVolta() {
  if (_retornoUrl) return _retornoUrl;                       // veio do PCM (aba nova)
  if (_osId) return PCF_PIPELINE_URL + '?modo=pipeline&os_id=' + encodeURIComponent(_osId);
  return '';                                                 // avulso: não há pipeline
}

// falhou=true ⇒ mostra o botão mas NÃO sai sozinho (envio pendente ou travado).
function prepararTelaFinal(falhou) {
  lerRetornoDaUrl();
  var btnV  = document.getElementById('btn-voltar-pipeline');
  var aviso = document.getElementById('auto-volta-aviso');
  var canc  = document.getElementById('auto-volta-cancelar');
  if (btnV && !btnV._wired) { btnV._wired = true; btnV.onclick = voltarAoPipeline; }
  if (canc && !canc._wired) { canc._wired = true; canc.onclick = function (ev) { ev.preventDefault(); cancelarAutoVolta(); }; }
  if (!btnV) return;
  var destino = destinoDeVolta();
  if (!destino) { btnV.style.display = 'none'; if (aviso) aviso.style.display = 'none'; return; }
  btnV.style.display = '';
  btnV.textContent = _retornoUrl ? '✅ Concluir e voltar ao ProperAdmin' : '✅ Concluir e voltar ao pipeline';
  if (falhou || _autoVoltaCancelado) { if (aviso) aviso.style.display = 'none'; return; }
  Promise.resolve(_pdfAguardando).catch(function () {}).then(function () { iniciarAutoVolta(8); });
}

function iniciarAutoVolta(seg) {
  if (_autoVoltaTimer || _autoVoltaCancelado) return;        // já contando / já recusado
  var aviso = document.getElementById('auto-volta-aviso');
  var span  = document.getElementById('auto-volta-seg');
  if (!aviso || !span) return;
  aviso.style.display = '';
  span.textContent = seg;
  _autoVoltaTimer = setInterval(function () {
    seg--;
    span.textContent = seg;
    if (seg <= 0) { clearInterval(_autoVoltaTimer); _autoVoltaTimer = null; voltarAoPipeline(); }
  }, 1000);
}

function cancelarAutoVolta() {
  clearInterval(_autoVoltaTimer);
  _autoVoltaTimer = null;
  _autoVoltaCancelado = true;
  var aviso = document.getElementById('auto-volta-aviso');
  if (aviso) aviso.style.display = 'none';
}

function voltarAoPipeline() {
  clearInterval(_autoVoltaTimer);
  _autoVoltaTimer = null;
  try { limparRascunho(); } catch (e) {}   // o laudo já está no sistema; rascunho órfão foi a classe do bug de 28/07
  var destino = destinoDeVolta();
  if (!destino) {
    if (history.length > 1) history.back();
    else location.href = 'https://grupotap.github.io/ProperHub/';
    return;
  }
  location.href = destino;
}


// ══ PDF (estilo Form 02) → DRIVE (Gestão de Documentos) ══════════════════════
// Monta um #pdf-layout com o cabeçalho Proper + seções do schema + parecer,
// captura com html2canvas, pagina num PDF A4 (jsPDF) e sobe via salvarPdfDrive
// (ação já existente no GAS v68+). ADITIVO: sem mudança de GAS; 1x/sessão.
// 29/07 (F-30): o laudo/termo é capturado num ÚNICO canvas. Com muitas fotos o
// canvas estoura o limite do navegador (iOS ~16 Mpx) e o toDataURL devolve uma
// imagem em BRANCO — o PDF subia vazio em silêncio. Agora o scale é reduzido
// para caber no orçamento de pixels e o resultado suspeito (dataURL minúsculo)
// vira ERRO visível em vez de PDF branco.
/* ══ PAGINADOR REAL — 13/08/2026 ═══════════════════════════════════════════
   ADITIVO. Nada existente foi renomeado ou removido: buildPdfLayout, o
   #pdf-layout, as classes p1- / pdf- / pl- e o _pdfChecarCanvas continuam
   valendo. O que muda é COMO o layout vira folhas.

   O QUE ISTO SUBSTITUI — "a guilhotina":
     var canvas = await html2canvas(el, ...);        // UMA imagem do doc inteiro
     while (heightLeft > 0){ position = heightLeft - imgH; pdf.addPage(); ... }
   O documento virava um bitmap único e era cortado a cada 297 mm por geometria
   pura, cego ao conteúdo: meia foto no pé de uma página e meia no topo da outra,
   linhas de texto partidas no meio dos glifos, cabeçalho de seção decapitado.
   E `page-break-inside:avoid` no CSS era CÓDIGO MORTO — html2canvas rasteriza,
   nunca avalia essas regras, o que dava uma falsa sensação de proteção.

   COMO FUNCIONA AGORA (mesma ideia do motor tp-* do form_locacao/form_generica,
   só que genérica: trabalha sobre o #pdf-layout que cada form já monta):
     1. mede cada filho direto do #pdf-layout na largura real de folha (794 px)
     2. o que for mais alto que a folha é QUEBRADO — tabela parte por <tr>
        repetindo o <thead> (marcado como continuação), grade de fotos parte por
        foto, container parte pelos filhos; a recursão desce até caber
     3. empacota em folhas A4 sem cortar nada, com cabeçalho de seção nunca órfão
     4. da 2ª folha em diante injeta uma FAIXA DE CONTINUAÇÃO (logo + OS +
        cliente) — antes, da página 2 em diante o documento não tinha nenhuma
        identificação
     5. rodapé com "Página X de Y" em TODAS as folhas — antes o rodapé existia
        uma vez só, no fim do bitmap, e 4 de 5 páginas saíam anônimas
     6. captura UMA FOLHA POR VEZ. Além de resolver o corte, isso derruba o
        orçamento de pixels por captura de ~16 Mpx para ~3,6 Mpx, que é a causa
        raiz do "PDF sai em branco" no iOS.
   ═════════════════════════════════════════════════════════════════════════ */
(function(){
  if (window.pgpPaginarPdf) return;
  var W = 794, H = 1123, FOOT_H = 34, CONT_H = 32;

  function _css(){
    if (document.getElementById('pgpPagCss')) return;
    var s = document.createElement('style'); s.id = 'pgpPagCss';
    s.textContent =
      '.pgp-page{width:794px;height:1123px;position:relative;background:#fff;overflow:hidden}'
    + '.pgp-page.pgp-meas{height:auto;overflow:visible}'
    + '.pgp-cont{display:table;width:100%;border-bottom:2px solid #f58220;background:#fff}'
    + '.pgp-cont>div{display:table-cell;vertical-align:middle;padding:6px 10px;'
      + 'font-family:Arial,Helvetica,sans-serif}'
    + '.pgp-cont .t{font-size:8.5pt;font-weight:700;color:#1a1a1a}'
    + '.pgp-cont .r{text-align:right;font-size:7pt;color:#666;white-space:nowrap}'
    + '.pgp-foot{position:absolute;left:10px;right:10px;bottom:10px;height:20px;'
      + 'border-top:1px solid #ddd;padding-top:5px;font-family:Arial,Helvetica,sans-serif;'
      + 'font-size:6.5pt;color:#777}'
    + '.pgp-foot .l{float:left}.pgp-foot .r{float:right}'
    + '.pgp-tcont{background:#eee !important;color:#555 !important;font-size:6.5pt !important;'
      + 'font-weight:400 !important;text-align:left !important;font-style:italic;padding:2px 4px !important}';
    document.head.appendChild(s);
  }
  /* Altura COM as margens. getBoundingClientRect ignora margin, e somar alturas
     sem elas subestimava a folha — o ultimo bloco encostava (ou invadia) a faixa
     do rodape. Conservador de proposito: melhor sobrar folha do que sobrepor. */
  function _h(el){
    var r = el.getBoundingClientRect().height, cs;
    try{ cs = window.getComputedStyle(el); }catch(e){ return r; }
    return r + (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0);
  }
  function _clonRaso(el){
    var c = el.cloneNode(false);
    if (c.removeAttribute) c.removeAttribute('id');   // não duplicar id no documento
    return c;
  }
  function _tabelaDe(el){
    if (el.tagName === 'TABLE') return el;
    var t = el.querySelectorAll ? el.querySelectorAll('table') : [];
    return (t.length === 1 && el.children.length === 1) ? t[0] : null;
  }
  /* Parte uma tabela por <tr>, repetindo o <thead> e marcando a continuação —
     antes o cabeçalho voltava IDÊNTICO e o leitor concluía que a seção estava
     duplicada (é uma das três causas do "repete títulos"). */
  function _partirTabela(bloco, tbl, cap, med){
    var thead = tbl.querySelector('thead');
    var trs = [].slice.call(tbl.querySelectorAll('tbody > tr'));
    if (trs.length < 4) return null;
    var extra = _h(bloco) - _h(tbl);                 // padding/borda do wrapper
    var hHead = thead ? _h(thead) : 0;
    var partes = [], i = 0, guard = 0;
    while (i < trs.length && guard++ < 400){
      var casca = (bloco === tbl) ? _clonRaso(tbl) : _clonRaso(bloco);
      var tb;
      if (bloco === tbl){ tb = casca; }
      else { tb = _clonRaso(tbl); casca.appendChild(tb); }
      if (thead) tb.appendChild(thead.cloneNode(true));
      if (partes.length && thead){
        var mk = document.createElement('thead');
        mk.innerHTML = '<tr><th class="pgp-tcont" colspan="12">continuação da tabela anterior</th></tr>';
        tb.insertBefore(mk, tb.firstChild);
      }
      var body = document.createElement('tbody'); tb.appendChild(body);
      med.appendChild(casca);
      var posto = 0;
      while (i < trs.length){
        body.appendChild(trs[i].cloneNode(true)); posto++; i++;
        if (_h(casca) + extra > cap){
          if (posto > 1){ body.removeChild(body.lastChild); i--; posto--; }
          break;
        }
      }
      if (!posto) break;
      partes.push(casca);
    }
    return partes.length > 1 ? partes : null;
  }
  /* Quebra recursiva: tabela por linha, container pelos filhos, e desce até caber. */
  function _quebrar(el, cap, med, nivel){
    med.appendChild(el);
    if (_h(el) <= cap) return [el];
    var tbl = _tabelaDe(el);
    if (tbl){ var p = _partirTabela(el, tbl, cap, med); if (p) return p; }
    var kids = [].slice.call(el.children);
    if (!kids.length || nivel > 3) return [el];        // não dá para dividir: entra inteiro
    var out = [], cur = _clonRaso(el);
    med.appendChild(cur);
    kids.forEach(function(k){
      cur.appendChild(k);
      if (_h(cur) > cap && cur.children.length > 1){
        cur.removeChild(k);
        out.push(cur);
        cur = _clonRaso(el); med.appendChild(cur); cur.appendChild(k);
      }
    });
    if (cur.children.length) out.push(cur);
    var fim = [];
    out.forEach(function(c){
      if (_h(c) > cap && c.children.length === 1){
        fim = fim.concat(_quebrar(c.children[0], cap, med, (nivel||0)+1));
      } else fim.push(c);
    });
    return fim.length ? fim : [el];
  }
  function _ehCabecalhoSecao(el){
    var c = ' ' + (el.className || '') + ' ';
    return /sec-head|pl-sec-head|p1-sec-head|pl-gw|pdf-gateway|pgp-keep/.test(c);
  }

  window.pgpPaginarPdf = async function(host, opts){
    opts = opts || {};
    _css();
    // Guarda: quem chama já carrega as libs sob demanda, mas o paginador é
    // helper compartilhado — não pode depender da ordem de quem o usa.
    if ((!window.jspdf || !window.html2canvas) && typeof pgpEnsureLibsPDF === 'function'){
      try{ await pgpEnsureLibsPDF(); }catch(e){}
    }
    if (!window.jspdf || !window.html2canvas) throw new Error('bibliotecas de PDF ausentes');
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    var cap1 = H - FOOT_H, capN = H - FOOT_H - CONT_H;

    /* rodapé: usa o texto do rodapé que o próprio form já monta, e retira o nó
       do fluxo — senão ele apareceria como conteúdo no fim da última folha. */
    var rodape = opts.rodape || '';
    if (opts.footSel){
      var fn = host.querySelector(opts.footSel);
      if (fn){ rodape = rodape || (fn.textContent || '').trim(); fn.parentNode.removeChild(fn); }
    }

    var filhos = [].slice.call(host.children);
    var med = document.createElement('div');
    med.className = 'pgp-page pgp-meas';
    host.innerHTML = ''; host.appendChild(med);

    /* 1) medir e quebrar o que não cabe */
    var blocos = [];
    filhos.forEach(function(f){
      _quebrar(f, cap1, med, 0).forEach(function(b){
        blocos.push({ el:b, keep:_ehCabecalhoSecao(b) });
      });
    });
    blocos.forEach(function(b){ b.h = _h(b.el); });

    /* 2) empacotar sem cortar nada */
    var paginas = [[]], usado = 0;
    function cap(){ return paginas.length === 1 ? cap1 : capN; }
    for (var k = 0; k < blocos.length; k++){
      var b = blocos[k];
      /* Cabeçalho de seção não pode ficar órfão no pé da folha. Se o bloco
         seguinte CABE numa folha, exige-se ele INTEIRO — pedir só "um pedaço"
         deixava a barra da seção sozinha com 650 px de papel branco embaixo
         (visto na bancada do form01: "REGISTRO FOTOGRÁFICO" numa folha e as
         fotos na seguinte). Se o seguinte é maior que a folha, ele vai ser
         quebrado de qualquer jeito — aí basta caber um pedaço. */
      var prox = 0;
      if (b.keep && blocos[k+1]) prox = (blocos[k+1].h > cap()) ? 200 : blocos[k+1].h;
      var precisa = b.h + prox;
      if (usado > 0 && usado + precisa > cap()){ paginas.push([]); usado = 0; }
      paginas[paginas.length-1].push(b); usado += b.h;
    }

    /* 3) montar as folhas de verdade */
    host.innerHTML = '';
    var folhas = [];
    paginas.forEach(function(itens, pi){
      var pg = document.createElement('div'); pg.className = 'pgp-page';
      if (pi > 0){
        var cb = document.createElement('div'); cb.className = 'pgp-cont';
        cb.innerHTML = '<div class="t">' + (opts.titulo || 'ProperCare') + '</div>'
          + '<div class="r">' + (opts.os ? ('OS ' + opts.os + ' · ') : '')
          + (opts.cliente || '') + '</div>';
        pg.appendChild(cb);
      }
      itens.forEach(function(it){ pg.appendChild(it.el); });
      var ft = document.createElement('div'); ft.className = 'pgp-foot';
      ft.innerHTML = '<span class="l">' + rodape + '</span>'
        + '<span class="r">Página ' + (pi+1) + ' de ' + paginas.length + '</span>';
      pg.appendChild(ft);
      host.appendChild(pg); folhas.push(pg);
    });

    /* 4) capturar UMA FOLHA POR VEZ */
    var escala = Math.max(1, Math.min(2, Math.sqrt(16000000 / (W * H))));
    for (var p = 0; p < folhas.length; p++){
      var canvas = await html2canvas(folhas[p], {
        scale: escala, backgroundColor:'#ffffff', useCORS:true, logging:false,
        width: W, height: H, windowWidth: W });
      var img = canvas.toDataURL('image/jpeg', 0.92);
      if (typeof _pdfChecarCanvas === 'function') _pdfChecarCanvas(canvas, img);
      if (p > 0) pdf.addPage();
      pdf.addImage(img, 'JPEG', 0, 0, 210, 297);
    }
    return pdf;
  };
})();

function _pdfScaleSeguro(el){
  var MAXPX = 16000000;
  var w = (el && (el.offsetWidth || el.scrollWidth)) || 794;
  var h = (el && (el.scrollHeight || el.offsetHeight)) || 1123;
  var s = Math.sqrt(MAXPX / (w * h));
  if (!isFinite(s) || s <= 0) s = 1;
  s = Math.min(2, s);
  return Math.max(0.5, Math.round(s * 100) / 100);
}
function _pdfChecarCanvas(canvas, imgData){
  if (!canvas || !canvas.width || !canvas.height) throw new Error('captura do documento saiu vazia neste aparelho');
  if (!imgData || imgData.length < 5000) throw new Error('PDF sairia em BRANCO neste aparelho (imagem grande demais) — reduza a quantidade de fotos e gere de novo');
}

/* ══ 13/08 (G10c) — AS FOTOS ENTRAM NO LAUDO ═══════════════════════════════
   Antes, `_pdfResHtml` escrevia literalmente "3 foto(s)" na celula onde deveria
   estar a evidencia: as fotos subiam para o Drive e o documento entregue ao
   cliente nao mostrava nenhuma. Numa PERITAGEM esse era o defeito funcional
   mais grave do conjunto.
   Os bytes vem de duas fontes, nessa ordem:
     1. as miniaturas na tela (fotos desta sessao) — custo zero, funciona offline
     2. o Drive, via getFotoBase64 (GAS v78), em lotes de 4 — para rascunho
        restaurado, onde os bytes nao existem mais no aparelho
   O mecanismo do lote e' o mesmo que o form02 ja usava em pdfHidratarFotosDrive. */
var _plFotoB64 = {};
async function _plHidratarFotos(){
  try{
    Object.keys(state.fotos||{}).forEach(function(k){
      var cont = document.getElementById('thumbs-'+k); if(!cont) return;
      var imgs = cont.querySelectorAll('img'), arr = state.fotos[k]||[];
      for (var i=0; i<arr.length && i<imgs.length; i++){
        var src = imgs[i].getAttribute('src')||'';
        if (src.indexOf('data:')===0 && arr[i] && arr[i].url) _plFotoB64[arr[i].url] = src;
      }
    });
  }catch(e){}
  var faltam = [];
  Object.keys(state.fotos||{}).forEach(function(k){
    (state.fotos[k]||[]).forEach(function(f){
      if (f && f.url && !_plFotoB64[f.url] && faltam.indexOf(f.url)<0) faltam.push(f.url);
    });
  });
  for (var i=0; i<faltam.length; i+=4){
    var lote = faltam.slice(i, i+4);
    await Promise.all(lote.map(async function(u){
      try{
        var d = await gasPostJson({ action:'getFotoBase64', key:KEY, url:u });
        if (d && d.status==='ok' && d.base64) _plFotoB64[u] = 'data:'+(d.mimeType||'image/jpeg')+';base64,'+d.base64;
      }catch(e){}
    }));
  }
}
function _pdfFotosHtml(it){
  var arr = state.fotos[it.k]||[];
  var cels = arr.map(function(f, ix){
    var src = (f && f.url) ? _plFotoB64[f.url] : '';
    var cap = escHtml(it.label) + (arr.length>1 ? (' ('+(ix+1)+'/'+arr.length+')') : '');
    return '<div class="pl-foto">'
      + (src ? '<img src="'+src+'">' : '<div class="pl-fsem">foto no Drive — não embutida neste aparelho</div>')
      + '<div class="pl-fcap">'+cap+'</div></div>';
  }).join('');
  return '<div class="pl-fotos">'+cels+'</div>';
}
function _pdfResHtml(it){

  var v = state.itens[it.k];
  if (it.c==='foto'){ var arr=state.fotos[it.k]||[]; return arr.length ? (arr.length+' foto(s)') : '—'; }
  if (v==null || v==='') return '—';
  if (it.c==='sn' || it.c==='snnt'){
    var lbl = {sim:'Sim',nao:'Não',na:'N/A',nt:'NT'}[v] || v;
    var cls = v==='sim' ? 'ok' : (v==='nao' ? 'no' : 'na');
    return '<span class="pl-badge '+cls+'">'+escHtml(lbl)+'</span>';
  }
  if (it.c==='escala'){ return {bom:'Bom',regular:'Regular',ruim:'Ruim'}[v] || escHtml(v); }
  if (it.c==='med'){ return escHtml(v) + (it.unit ? (' '+escHtml(it.unit)) : ''); }
  return escHtml(v);
}
function buildPdfLayout(){
  var id = state.identificacao || {};
  var secHtml = SC.secoes.map(function(s){
    var rows = s.itens.filter(function(it){
      // 13/08 (G10a): o PDF divergia da TELA. Com o gateway nao escolhido
      // (_gwVal===''), `it.gw && _gwVal && ...` era falso e o PDF imprimia os
      // itens de TODOS os tipos juntos (Parafuso E Pistao), preenchidos com "—",
      // enquanto applyGwVisibility escondia todos eles na tela. Mesmo criterio agora.
      if (it.gw && it.gw !== _gwVal) return false;
      // 13/08 (G10b): item nao respondido nao vira linha de travessao. Um laudo
      // com 45 itens e 12 respondidos gerava 33 linhas de "—".
      if (it.c === 'foto') return ((state.fotos[it.k]||[]).length > 0);
      var _v = state.itens[it.k];
      return !(_v == null || _v === '');
    }).map(function(it){
      // 13/08 (G10c): a foto entra como EVIDENCIA, nao como a contagem dela.
      if (it.c === 'foto') return '<tr><td colspan="2" class="pl-fwrap">'+_pdfFotosHtml(it)+'</td></tr>';
      return '<tr><td>'+escHtml(it.label)+'</td><td class="pl-res">'+_pdfResHtml(it)+'</td></tr>';
    }).join('');
    if (!rows) return '';
    return '<div class="pl-sec-head">'+escHtml(s.t)+'</div><table><tbody>'+rows+'</tbody></table>';
  }).join('');
  var html = ''
    + '<div class="pl-header">'
    +   '<div class="pl-logo"><span class="pl-logo-circle">P</span></div>'
    +   '<div class="pl-title"><span class="pl-form-name">'+escHtml(String(SC.titulo).toUpperCase())+'</span><span class="pl-form-sub">'+escHtml(SC.subtitulo||'')+'</span></div>'
    +   '<div class="pl-fields">'
    +     '<div class="pl-id-row"><span class="pl-id-label">OS Nº</span><span class="pl-id-val">'+escHtml(id.os||'')+'</span><span class="pl-id-label">Data:</span><span class="pl-id-val">'+escHtml(id.data||'')+'</span></div>'
    +     '<div class="pl-id-row"><span class="pl-id-label">Cliente:</span><span class="pl-id-val">'+escHtml(id.cliente||'')+'</span></div>'
    +     '<div class="pl-id-row"><span class="pl-id-label">Equip./TAG:</span><span class="pl-id-val">'+escHtml(id.equipamento||'')+'</span></div>'
    +     '<div class="pl-id-row"><span class="pl-id-label">Modelo/Série:</span><span class="pl-id-val">'+escHtml(id.modelo||'')+'</span></div>'
    +     '<div class="pl-id-row"><span class="pl-id-label">Horímetro:</span><span class="pl-id-val">'+escHtml(id.horimetro||'')+'</span><span class="pl-id-label">Ano:</span><span class="pl-id-val">'+escHtml(id.ano||'')+'</span></div>'
    +     '<div class="pl-id-row"><span class="pl-id-label">Técnico:</span><span class="pl-id-val">'+escHtml(id.tecnico||'')+'</span></div>'
    +   '</div>'
    + '</div>'
    + '<div class="pl-gw">◆ '+escHtml(SC.gateway.label)+': '+escHtml(_gwVal||'—')+'</div>'
    + secHtml
    + '<div class="pl-sec-head">D — Observações e recomendações</div><div class="pl-obs">'+(escHtml(state.observacoes||'') || '—')+'</div>'
    + '<div class="pl-sec-head">E — Parecer técnico</div><div class="pl-parecer">'
    +   '<div><b>Parecer:</b> '+escHtml(state.parecer.parecer||'—')+'</div>'
    +   '<div><b>Urgência:</b> '+escHtml(state.parecer.urgencia||'—')+'</div>'
    +   '<div style="display:flex;gap:24px;margin-top:8px"><div style="flex:1"><div class="pl-sig"></div>'+escHtml(state.parecer.assinatura||'Responsável técnico')+'</div><div style="flex:1"><div class="pl-sig"></div>Cliente / ciência</div></div>'
    + '</div>'
    + '<div class="pl-footer">propercompressores.com.br &bull; '+escHtml(SC.titulo)+' &bull; documento gerado automaticamente</div>';
  document.getElementById('pdf-layout').innerHTML = html;
}
// 29/07 (F-12b): o envio do laudo deixou de ser fire-and-forget silencioso —
// a tela final mostra o estado do PDF e oferece "↻ Reenviar laudo" quando falha.
function pdfStatus(txt, erro){
  var e=document.getElementById('okPdfStatus');
  if(e){ e.textContent=txt||''; e.style.color = erro ? '#fca5a5' : ''; }
  var b=document.getElementById('btnReenviarPdf');
  if(b) b.style.display = erro ? '' : 'none';
}
async function reenviarPdf(){
  var b=document.getElementById('btnReenviarPdf');
  if(b){ b.disabled=true; b.textContent='Reenviando…'; }
  _pdfEnviado=false;
  await enviarPdfParaDrive();
  if(b){ b.disabled=false; b.textContent='↻ Reenviar laudo'; }
}
async function enviarPdfParaDrive(){
  if (_pdfEnviado || !_osId) return;
  // 13/08 (perf): as libs de PDF nao vem mais no <head> — entram aqui, no unico
  // momento em que fazem falta. A mensagem de erro e' a MESMA de antes; so mudou
  // o gatilho. O pdfStatus/btnReenviarPdf que ja existiam continuam mandando.
  pdfStatus('📄 Preparando o laudo…');
  pgpEsperaLonga('📄 Preparando o laudo…');
  try{
    await pgpEnsureLibsPDF();
  }catch(eLib){
    pgpEsperaLonga(null);
    pdfStatus('⚠️ Laudo NÃO enviado: a biblioteca de PDF não carregou. Recarregue a página e toque em Reenviar.', true);
    return;
  }
  if (!window.jspdf || !window.html2canvas){
    pgpEsperaLonga(null);
    pdfStatus('⚠️ Laudo NÃO enviado: a biblioteca de PDF não carregou. Recarregue a página e toque em Reenviar.', true);
    return;
  }
  _pdfEnviado = true;
  pdfStatus('📄 Enviando laudo ao Drive…');
  pgpEsperaLonga('📄 Gerando o laudo em PDF…');   // 13/08 (perf)
  var el = document.getElementById('pdf-layout');
  try{
    await _plHidratarFotos();   // 13/08 (G10c)
    buildPdfLayout();
    el.classList.add('pdf-capturing');
    el.style.cssText = 'display:block;position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1;';
    // 13/08: a guilhotina virou paginacao real (cabecalho de continuacao + Pagina X de Y).
    var _idp = state.identificacao || {};
    var pdf = await pgpPaginarPdf(el, {
      titulo:String(SC.titulo||'Peritagem'),
      os:_idp.os||'', cliente:_idp.cliente||'', footSel:'.pl-footer' });
    el.classList.remove('pdf-capturing'); el.style.cssText = 'display:none';

    var id = state.identificacao || {};
    var _sess = null; try { _sess = JSON.parse(localStorage.getItem('proper_session') || 'null'); } catch(e) {}
    var _num = id.os || '';
    var nomeCurto = SC.tipoForm==='form04' ? 'Peritagem_Eletrica' : 'Peritagem_Mecanica';
    var base64 = pdf.output('datauristring').split(',')[1];
    var payload = {
      action:'salvarPdfDrive', key: KEY,
      os_id:_osId, os_numero:_num, cliente: id.cliente || 'SemCliente',
      maquina_id: (_maqAtual && _maqAtual.id) || '',
      maquina_label: (_maqAtual ? maqLabel(_maqAtual) : (id.equipamento || '')),
      base64: base64, fileName: nomeCurto + '_' + SC.tipoForm + '_' + (_num || _osId || 's_os') + '.pdf',
      categoria: 'pdf_' + SC.tipoForm, caption: SC.titulo, pdf_uid: _pdfUid,
      createdBy: (id.tecnico || (_sess && _sess.tecnico && _sess.tecnico.nome) || '')
    };
    var d = await gasPostJson(payload);   // 29/07 (F-12): parse seguro + retry
    if (!d || d.status !== 'ok') throw new Error((d && d.error) || 'falha ao salvar PDF');
    pdfStatus('✅ Laudo enviado ao Drive (Gestão de Documentos).');
    toast('PDF da peritagem salvo no Drive');
  }catch(e){
    _pdfEnviado = false;
    if (el){ el.classList.remove('pdf-capturing'); el.style.cssText = 'display:none'; }
    pdfStatus('⚠️ Laudo NÃO enviado: ' + e.message, true);
    toast('Peritagem enviada; PDF ao Drive falhou: ' + e.message);
  }
}

// ══ 29/07 (F-13) RASCUNHO POR OS ══════════════════════════════════════════
// A chave era inexistente aqui (nenhum rascunho) e no form02 era GLOBAL — abrir
// uma OS nova trazia o rascunho da OS anterior (bug de 28/07). Aqui já nasce por
// OS: resolveDraftKey() roda no init DEPOIS de ler os_id da URL; sem os_id (uso
// avulso) usa a chave legada; a migração do rascunho legado só acontece se ele
// declarar (_draft_os_id) ser DESTA OS.
const DRAFT_KEY_LEGADO = 'proper_draft_form03';
let DRAFT_KEY = DRAFT_KEY_LEGADO;
function resolveDraftKey(){
  DRAFT_KEY = _osId ? (DRAFT_KEY_LEGADO + ':' + _osId) : DRAFT_KEY_LEGADO;
  if (_osId && !localStorage.getItem(DRAFT_KEY)){
    try{
      const leg = JSON.parse(localStorage.getItem(DRAFT_KEY_LEGADO) || 'null');
      if (leg && leg._draft_os_id === _osId){
        localStorage.setItem(DRAFT_KEY, JSON.stringify(leg));
        localStorage.removeItem(DRAFT_KEY_LEGADO);
      }
    }catch(e){}
  }
}
let _saveTimer = null;
function scheduleSave(){ clearTimeout(_saveTimer); _saveTimer = setTimeout(saveDraft, 500); }
// Um rascunho VAZIO não vira registro: evita criar chave e "restaurar" nada.
function _rascunhoTemConteudo(d){
  if(!d) return false;
  if(d.itens && Object.keys(d.itens).length) return true;
  if(d.observacoes) return true;
  if(d.gateway) return true;
  if(d.parecer && (d.parecer.parecer || d.parecer.urgencia || d.parecer.assinatura)) return true;
  if(d.fotos && Object.keys(d.fotos).some(function(k){ return (d.fotos[k]||[]).length; })) return true;
  var i=d.identificacao||{};
  return !!(i.cliente || i.equipamento || i.modelo || i.horimetro || i.ano || i.os);
}
function saveDraft(){
  if (_enviado) return;                       // instância já confirmada: não regrava
  try{
    captura();
    state.gateway = _gwVal;
    state._draft_os_id = _osId || '';         // carimbo da OS dona do rascunho
    if(!_rascunhoTemConteudo(state)) return;
    localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  }catch(e){}
}
function loadDraft(){
  try{ const raw = localStorage.getItem(DRAFT_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function limparRascunho(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function setVal(id,v){ var el=document.getElementById(id); if(el && v!=null && v!=='') el.value=v; }
function _marcarPill(box,v){
  if(!box || v==null || v==='') return false;
  var bts=box.querySelectorAll('button'), alvo=null;
  for(var i=0;i<bts.length;i++){ if(bts[i].getAttribute('data-v')===String(v)) alvo=bts[i]; }
  if(!alvo) return false;
  for(var j=0;j<bts.length;j++) bts[j].classList.remove('on');
  alvo.classList.add('on');
  return true;
}
function hydrateUI(d){
  if(!d || typeof d!=='object') return;
  var i = d.identificacao || {};
  setVal('i_tecnico',i.tecnico); setVal('i_data',i.data); setVal('i_os',i.os); setVal('i_cliente',i.cliente);
  setVal('i_equip',i.equipamento); setVal('i_modelo',i.modelo); setVal('i_horimetro',i.horimetro); setVal('i_ano',i.ano);
  SC.idExtra.forEach(function(f){ setVal('ix_'+f.k, i[f.k]); });
  state.identificacao = i;
  if(d.gateway){ _gwVal=d.gateway; state.gateway=d.gateway; _marcarPill(document.getElementById('gwPills'), d.gateway); applyGwVisibility(); }
  if(d.itens){
    Object.keys(d.itens).forEach(function(k){
      var v=d.itens[k]; state.itens[k]=v;
      if(_marcarPill(document.querySelector('.pills[data-k="'+k+'"]'), v)) return;
      var inp=document.querySelector('input[data-k="'+k+'"]') || document.querySelector('textarea[data-k="'+k+'"]');
      if(inp && v!=null) inp.value=v;
    });
  }
  if(d.observacoes){ setVal('o_obs', d.observacoes); state.observacoes=d.observacoes; }
  if(d.parecer){
    state.parecer = Object.assign({}, d.parecer);
    _marcarPill(document.getElementById('parPills'), d.parecer.parecer);
    _marcarPill(document.getElementById('urgPills'), d.parecer.urgencia);
    setVal('p_assinatura', d.parecer.assinatura);
  }
  // Fotos: os bytes NÃO ficam no rascunho (só as URLs do Drive). Restaura as refs
  // para o fotos_json sair completo e avisa o técnico do que já subiu.
  if(d.fotos){
    Object.keys(d.fotos).forEach(function(k){
      var arr=d.fotos[k]||[]; if(!arr.length) return;
      state.fotos[k]=arr;
      var cont=document.getElementById('thumbs-'+k); if(!cont) return;
      var nOk=arr.filter(function(f){ return f && f.status==='ok'; }).length;
      var nota=document.createElement('div');
      nota.style.cssText='font-size:12px;color:#94a3b8;margin-top:4px';
      nota.textContent=arr.length+' foto(s) deste rascunho · '+nOk+' já no Drive.';
      cont.appendChild(nota);
    });
  }
}
function wireInputs(){
  document.querySelectorAll('#form input, #form textarea, #form select').forEach(function(el){
    el.addEventListener('input', scheduleSave);
    el.addEventListener('change', scheduleSave);
  });
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function esc(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

// ══ Auto-carga do cabeçalho (URL tem prioridade; senão getMaquinasByOS — igual form01) ══
let _maquinas=[];
function setIfEmpty(id,v){ var el=document.getElementById(id); if(el && !el.value.trim() && v) el.value=v; }
function maqEquip(m){ return m.tag||m.type||m.tipo||m.brand||''; }
function maqModelo(m){ var l=[m.brand,m.model].filter(Boolean).join(' '); return l+(m.serial?(l?' / ':'')+'Série '+m.serial:''); }
function maqLabel(m){
  var base=[m.brand,m.model].filter(Boolean).join(' '); var extra=[];
  if(m.serial) extra.push('Série '+m.serial); if(m.tag) extra.push(m.tag);
  return (base||'Máquina')+(extra.length?' · '+extra.join(' · '):'');
}
function prefillFromUrl(p){
  var equip=p.get('equipamento')||p.get('equip')||p.get('tag')||'';
  var modelo=p.get('modelo')||p.get('modelo_serie')||'';
  var serie=p.get('serie')||p.get('serial')||'';
  if(serie) modelo = modelo ? (modelo+' / Série '+serie) : ('Série '+serie);
  setIfEmpty('i_equip',equip);
  setIfEmpty('i_modelo',modelo);
  setIfEmpty('i_horimetro',p.get('horimetro')||p.get('hor')||'');
  setIfEmpty('i_ano',p.get('ano')||p.get('year')||'');
}
function aplicarMaquina(m){
  if(!m) return;
  _maqAtual=m;
  setIfEmpty('i_equip',maqEquip(m));
  setIfEmpty('i_modelo',maqModelo(m));
  setIfEmpty('i_horimetro',m.hourTotal?String(m.hourTotal):'');
  setIfEmpty('i_ano',m.year?String(m.year):'');
}
function selMaquina(){
  var idx=document.getElementById('i_maqSel').value; if(idx==='') return;
  var m=_maquinas[parseInt(idx,10)]; if(!m) return;
  _maqAtual=m;
  // seleção manual sobrescreve os campos de máquina
  document.getElementById('i_equip').value=maqEquip(m);
  document.getElementById('i_modelo').value=maqModelo(m);
  document.getElementById('i_horimetro').value=m.hourTotal?String(m.hourTotal):'';
  document.getElementById('i_ano').value=m.year?String(m.year):'';
}
async function carregarMaquinasOS(){
  if(!_osId) return;
  // 13/08 (perf): chamada de boot que ate hoje era 100% invisivel. O aviso some ao
  // terminar E ao falhar — o catch silencioso e' proposital (sem rede, preenche-se
  // a maquina a mao e segue).
  pgpBootAviso('🔄 Carregando dados da OS…');
  try{
  // 13/08 (perf): sem_pecas=true — GAS v97. Este POST e' a UNICA chamada de rede do
  // boot, e no v96 ele lia MACHINE_PARTS inteira (uma linha por peca por maquina) e
  // varria um laco maquinas x linhas so para anexar eq.parts a cada maquina. NENHUM
  // dos 8 formularios le .parts (grep confirma: zero ocorrencias). O parametro e'
  // OPCIONAL e ignorado por um GAS antigo, entao publicar o form antes do v97 nao
  // quebra nada. saveMachine (usado pela corretiva para devolver a maquina com o
  // horimetro novo) nao toca MACHINE_PARTS — conferido linha a linha no v96 —,
  // logo remover parts do objeto nao apaga peca nenhuma.
    const data=await gasPostJson({action:'getMaquinasByOS',sem_pecas:true,id_os:_osId});   // 29/07 (F-12)
    const machines=(data&&data.machines)||[]; if(!machines.length) return;
    _maquinas=machines;
    if(machines.length===1){ aplicarMaquina(machines[0]); }
    else{
      const wrap=document.getElementById('maqSelWrap'), sel=document.getElementById('i_maqSel');
      if(sel){ sel.innerHTML='<option value="">— selecione a máquina —</option>'+
        machines.map(function(m,i){ return '<option value="'+i+'">'+escHtml(maqLabel(m))+'</option>'; }).join('');
        wrap.style.display=''; }
    }
  }catch(e){ /* silencioso — técnico preenche à mão */ }
  finally{ pgpBootAviso(null); }   // 13/08 (perf)
}
function preencherResponsavelSessao(){
  var el=document.getElementById('i_tecnico'); if(!el||el.value.trim()) return;
  try{ var s=JSON.parse(localStorage.getItem('proper_session')||'null'); if(s&&s.tecnico&&s.tecnico.nome) el.value=s.tecnico.nome; }catch(e){}
}

(function init(){
  const p=new URLSearchParams(location.search);
  SC=SCHEMAS['03'];
  _osId=p.get('os_id')||''; _tarefaId=p.get('tarefa_id')||''; window._GC=p.get('gc')||window._GC||'';
  _origem=p.get('origem')||'';       // 29/07 (F-14): propagada pela OS Genérica
  resolveDraftKey();                 // 29/07 (F-13): DEPOIS de ler os_id da URL
  render();
  var _d=loadDraft();                // 29/07 (F-13): rascunho DESTA OS (nunca de outra)
  if(_rascunhoTemConteudo(_d)){ hydrateUI(_d); toast('Rascunho restaurado'); }
  if(p.get('cliente')) setIfEmpty('i_cliente',p.get('cliente'));
  if(p.get('os_numero')) setIfEmpty('i_os',p.get('os_numero'));
  prefillFromUrl(p);                 // cabeçalho por URL (prioridade)
  if(!val('i_data')) document.getElementById('i_data').value=new Date().toISOString().slice(0,10);
  if(_osId){ const pill=document.getElementById('osPill'); pill.style.display=''; pill.textContent='OS vinculada: '+(p.get('os_numero')||_osId); }
  preencherResponsavelSessao();
  carregarMaquinasOS();              // preenche o que a URL não trouxe
  wireInputs();                      // 29/07 (F-13): autosave com debounce
  window.addEventListener('pagehide', function(){ saveDraft(); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') saveDraft(); });
})();
</script>
